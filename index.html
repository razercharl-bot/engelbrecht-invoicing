<title>Engelbrecht Invoicing</title>
<meta name="description" content="Create invoices and quotes as Charl Engelbrecht, with a saved client list and running document numbers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F7F4;
    --paper-raised:#FFFFFF;
    --ink:#1B211D;
    --ink-soft:#5C6760;
    --ink-faint:#8B948D;
    --line:#DEE3DC;
    --line-strong:#C3CBC3;
    --accent:#1F5C4A;
    --accent-hover:#17473A;
    --accent-soft:#E3EEE8;
    --accent-ink:#0E332A;
    --warn:#A85326;
    --warn-soft:#F5E7DD;
    --good:#2E7D4F;
    --good-soft:#E1F0E6;
    --pending:#8E6B18;
    --pending-soft:#F6EEDC;
    --shadow: 0 1px 2px rgba(27,33,29,0.06), 0 6px 16px -8px rgba(27,33,29,0.18);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131C17;
      --paper-raised:#1A2620;
      --ink:#EAF0EA;
      --ink-soft:#A9B7AE;
      --ink-faint:#71827A;
      --line:#293A31;
      --line-strong:#3A4E43;
      --accent:#54B58C;
      --accent-hover:#6BC79E;
      --accent-soft:#1E3A2E;
      --accent-ink:#BFE9D3;
      --warn:#E08A55;
      --warn-soft:#3B2A1E;
      --good:#6FC492;
      --good-soft:#1E3A2A;
      --pending:#E0B15A;
      --pending-soft:#3A2F17;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -8px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#131C17;
    --paper-raised:#1A2620;
    --ink:#EAF0EA;
    --ink-soft:#A9B7AE;
    --ink-faint:#71827A;
    --line:#293A31;
    --line-strong:#3A4E43;
    --accent:#54B58C;
    --accent-hover:#6BC79E;
    --accent-soft:#1E3A2E;
    --accent-ink:#BFE9D3;
    --warn:#E08A55;
    --warn-soft:#3B2A1E;
    --good:#6FC492;
    --good-soft:#1E3A2A;
    --pending:#E0B15A;
    --pending-soft:#3A2F17;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -8px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Archivo', ui-sans-serif, system-ui, sans-serif;
    font-weight:700;
    text-wrap:balance;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; font-variant-numeric:tabular-nums; }
  a{color:var(--accent);}
  button{ font-family:inherit; }
  input, select, textarea{
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:var(--paper-raised);
    border:1px solid var(--line-strong);
    border-radius:6px;
    padding:8px 10px;
    width:100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; letter-spacing:0.01em; }
  textarea{ resize:vertical; min-height:70px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:14px; font-weight:600;
    padding:9px 15px; border-radius:7px;
    border:1px solid var(--line-strong);
    background:var(--paper-raised); color:var(--ink);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease, transform .04s ease;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--accent-soft); border-color:transparent; }
  .btn-danger{ color:var(--warn); }
  .btn-danger:hover{ background:var(--warn-soft); border-color:var(--warn-soft); }
  .btn-sm{ padding:6px 11px; font-size:13px; border-radius:6px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 9px; border-radius:100px;
    background:var(--line); color:var(--ink-soft);
  }
  .badge-draft{ background:var(--line); color:var(--ink-soft); }
  .badge-sent{ background:var(--pending-soft); color:var(--pending); }
  .badge-paid, .badge-accepted{ background:var(--good-soft); color:var(--good); }
  .badge-overdue, .badge-declined{ background:var(--warn-soft); color:var(--warn); }
  .badge-invoice{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge-quote{ background:var(--line); color:var(--ink-soft); }
  .badge-quoted{ background:var(--pending-soft); color:var(--pending); }
  .badge-approved{ background:var(--good-soft); color:var(--good); }
  .badge-printing{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge-completed{ background:var(--good-soft); color:var(--good); }
  .badge-invoiced{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge-cancelled{ background:var(--warn-soft); color:var(--warn); }

  #topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:center; gap:22px;
    padding:14px 20px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; flex:0 0 auto; }
  .brand-mark{ font-family:'Archivo'; font-weight:700; font-size:17px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono'; }
  nav.tabs{ display:flex; gap:2px; flex-wrap:wrap; }
  .tab{
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
    padding:8px 12px; border-radius:7px; cursor:pointer; border:1px solid transparent;
    background:transparent;
  }
  .tab:hover{ background:var(--accent-soft); color:var(--ink); }
  .tab.active{ background:var(--accent-soft); color:var(--accent-ink); }
  .topbar-spacer{ flex:1; }

  main{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }
  .view-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .view-head h1{ font-size:24px; }
  .view-sub{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; }
  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
  .card-pad{ padding:20px; }
  .grid{ display:grid; gap:16px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:720px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }

  .stat{ padding:16px 18px; }
  .stat-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); }
  .stat-value{ font-family:'IBM Plex Mono'; font-size:24px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
  .stat-value.accent{ color:var(--accent); }
  .stat-value.warn{ color:var(--warn); }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); padding:0 12px 10px; border-bottom:1px solid var(--line); }
  td{ padding:12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--accent-soft); }
  .table-wrap{ overflow-x:auto; }
  .num-cell{ font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; text-align:right; }
  .row-link{ cursor:pointer; }

  .empty{ text-align:center; padding:56px 24px; color:var(--ink-soft); }
  .empty h3{ font-size:16px; margin-bottom:6px; color:var(--ink); }
  .empty p{ font-size:13.5px; max-width:38ch; margin:0 auto 18px; }
  .empty-icon{ font-size:30px; margin-bottom:10px; opacity:.7; }

  .field{ margin-bottom:14px; }
  .field-row{ display:flex; gap:12px; }
  .field-row > .field{ flex:1; }
  .hint{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; background:var(--accent-soft); border-radius:8px; }
  .switch{ position:relative; width:38px; height:22px; flex:0 0 auto; }
  .switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch .track{ position:absolute; inset:0; background:var(--line-strong); border-radius:100px; transition:background .15s; }
  .switch input:checked + .track{ background:var(--accent); }
  .switch .thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked ~ .thumb{ left:18px; }

  .items-table th, .items-table td{ padding:8px 8px; }
  .items-table input{ padding:7px 8px; }
  .items-table .desc-col{ width:50%; }
  .items-table .num-col{ width:120px; }
  .items-table .del-col{ width:36px; }

  .totals{ margin-left:auto; width:280px; display:flex; flex-direction:column; gap:8px; }
  .totals-row{ display:flex; justify-content:space-between; font-size:14px; }
  .totals-row.total{ font-weight:700; font-size:17px; border-top:1px solid var(--line); padding-top:10px; margin-top:2px; }
  .totals-row.total .mono{ color:var(--accent); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,26,22,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--paper-raised); border-radius:12px; box-shadow:var(--shadow); max-width:460px; width:100%; padding:22px; max-height:88vh; overflow:auto; }
  .modal h2{ font-size:17px; margin-bottom:16px; }

  .sheet-wrap{ background:#3d4640; padding:32px 16px; border-radius:12px; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sheet-wrap{ background:#0c1310; } }
  :root[data-theme="dark"] .sheet-wrap{ background:#0c1310; }
  .sheet{
    background:#ffffff; color:#181c1a;
    max-width:760px; margin:0 auto;
    padding:48px 44px; border-radius:3px;
    box-shadow:0 8px 30px -6px rgba(0,0,0,0.4);
  }
  .sheet-head{ display:flex; justify-content:space-between; gap:20px; align-items:flex-start; padding-bottom:22px; border-bottom:2px solid #181c1a; }
  .sheet-brand{ font-family:'Archivo'; font-weight:700; font-size:19px; }
  .sheet-meta-line{ font-size:12.5px; color:#4b544e; margin-top:2px; }
  .sheet-doctitle{ text-align:right; }
  .sheet-doctitle .kind{ font-family:'Archivo'; font-weight:700; font-size:20px; letter-spacing:0.02em; }
  .sheet-doctitle .num{ font-family:'IBM Plex Mono'; font-size:14px; color:#4b544e; margin-top:2px; }
  .sheet-parties{ display:flex; justify-content:space-between; gap:24px; margin:26px 0; }
  .sheet-parties .label{ font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#8a9189; margin-bottom:5px; }
  .sheet-parties .block{ font-size:13.5px; line-height:1.55; }
  .sheet-dates{ font-size:12.5px; color:#4b544e; text-align:right; }
  .sheet table{ font-size:13px; color:#181c1a; }
  .sheet th{ color:#8a9189; border-bottom:2px solid #181c1a; padding-bottom:8px; }
  .sheet td{ color:#181c1a; border-bottom:1px solid #dfe3de; padding:10px 12px; }
  .sheet .totals-row{ font-size:13.5px; }
  .sheet .totals-row.total{ border-top:2px solid #181c1a; }
  .sheet-notes{ margin-top:26px; font-size:12.5px; color:#39413c; background:#f4f6f3; border-radius:6px; padding:12px 14px; white-space:pre-wrap; }
  .sheet-pay{ margin-top:18px; font-size:12.5px; color:#39413c; }
  .sheet-pay .label{ font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#8a9189; margin-bottom:5px; }
  .sheet-foot{ margin-top:34px; padding-top:14px; border-top:1px solid #dfe3de; font-size:11.5px; color:#8a9189; text-align:center; }
  .sheet tbody tr:hover{ background:transparent; }

  .doc-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .status-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .banner{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:8px; background:var(--accent-soft); color:var(--accent-ink); font-size:13.5px; margin-bottom:18px; }
  .confirm-inline{ display:flex; gap:6px; align-items:center; }

  details.card > summary{ list-style:none; }
  details.card > summary::-webkit-details-marker{ display:none; }
  details.card > summary::before{ content:'▸ '; color:var(--ink-faint); }
  details.card[open] > summary::before{ content:'▾ '; color:var(--ink-faint); }

  @media print{
    body *{ visibility:hidden; }
    .sheet, .sheet *{ visibility:visible; }
    .sheet-wrap{ background:none; padding:0; }
    .sheet{ box-shadow:none; position:absolute; top:0; left:0; width:100%; max-width:none; padding:0; margin:0; }
    @page{ margin:16mm; }
  }
</style>

  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" data-nav="dashboard" style="cursor:pointer;">Charl</span>
      <span class="brand-sub" id="sync-indicator"></span>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="topbar-spacer"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------------- formatting helpers ---------------- */
  function fmtMoney(n){
    n = Number(n)||0;
    try{ return new Intl.NumberFormat('en-ZA', {style:'currency', currency:'ZAR'}).format(n); }
    catch(e){ return 'R ' + n.toFixed(2); }
  }
  function fmtDate(iso){
    if(!iso) return '—';
    var d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return '—';
    return d.toLocaleDateString('en-ZA', {day:'2-digit', month:'short', year:'numeric'});
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function addDays(iso, n){
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad4(n){ n = Math.max(1, n|0); return String(n).padStart(4,'0'); }

  /* ---------------- state ---------------- */
  var dbNS = null;          // resolved db capability namespace, or null
  var business = defaultBusiness();
  var clients = [];
  var docs = [];
  var reports = [];         // saved monthly client reports
  var counters = { invoice: 1, quote: 1, spquote: 1 };
  var view = { name: 'dashboard', params: {} };
  var draft = null;         // document editor working copy
  var reportDraft = null;   // report builder working copy
  var uiConfirm = null;     // id of row showing inline delete-confirm
  var modal = null;         // {type:'client', editingId:null} etc
  var pdfBusy = null;       // id of document currently being turned into a PDF
  var quotePdfBusy = null;  // id of a Solid Prints quote currently being turned into a PDF
  var reportPdfBusy = false; // true while a report is being turned into a PDF
  /* ---------------- Solid Prints costing system ----------------
     Printers / Materials / Consumables databases + a central, pure costing
     engine (computeJobCost) that the Calculator uses today and that
     Quotes/Dashboard/Reports will reuse later, so the math lives in exactly
     one place. */
  var printers = [];
  var materials = [];
  var consumables = [];
  var spSettings = defaultSpSettings();
  var calc = null;           // current calculator working state (lazily created)
  var calcAdvancedOpen = false; // whether the Calculator's advanced-costs <details> is expanded (persisted across re-renders)
  var calcEditingQuoteId = null; // set while the calculator is editing an existing Draft quote, so Save updates it in place
  var spQuotes = [];         // saved Solid Prints quotes — each doc is a full, frozen cost snapshot (see freezeQuoteFromCalc)
  var quoteFilter = { status: '', clientId: '', printerId: '', minProfit: '', maxProfit: '', from: '', to: '' };

  function defaultSpSettings(){
    return {
      electricityRate: 3.87,
      defaultLabourRate: 150,
      markups: [100,125,150,175,200],
      defaultMarkup: 150,
      customMarkupAllowed: true,
      defaultWasteGrams: 0,
      defaultPackaging: 0,
      defaultLabourOn: false,
      minimumMarginPct: 40
    };
  }
  function blankCalc(){
    return {
      jobName: '', clientId: '', quantity: 1, printerId: (printers[0] && printers[0].id) || '',
      calcType: 'single',              // 'plate' | 'single'
      unitsPerPlate: '', printTimePerPlate: '', printTimeHours: '',
      filamentGrams: {},               // materialId -> grams (per plate if calcType 'plate', else job total;
                                        // per UNIT when splitEnabled — see printerSplits below)
      wasteGrams: spSettings.defaultWasteGrams, failureAllowancePct: 0,
      labourEnabled: spSettings.defaultLabourOn, labourHours: '', labourRate: spSettings.defaultLabourRate,
      postProcessing: [],              // {description, hours, rate, amount}
      consumablesUsed: [],             // {consumableId, quantity}
      packagingAmount: spSettings.defaultPackaging,
      otherCosts: [],                  // {description, amount}
      customPrice: '', rounding: 'none', roundingCustom: '',
      // Split a single order across more than one printer — e.g. a P2S and an H2C with
      // different build plates — so each portion is costed against its own machine.
      splitEnabled: false,
      printerSplits: []                // {printerId, quantity, unitsPerPlate, printTimePerPlate, wasteGrams}
    };
  }
  function blankPrinterSplitLeg(){
    var p = printers.find(function(x){ return x.active !== false; });
    return { printerId: p ? p.id : '', quantity: 1, unitsPerPlate: 1, printTimePerPlate: '', wasteGrams: p ? (Number(p.defaultWasteGrams)||0) : 0 };
  }
  function printerMachineRate(printer){
    if(!printer) return {depreciationPerHour:0, maintenancePerHour:0, hourlyRate:0};
    var maintenancePerHour = Number(printer.maintenancePerHour)||0;
    if(printer.useManualHourlyCost){
      return {depreciationPerHour:0, maintenancePerHour:maintenancePerHour, hourlyRate: Number(printer.manualHourlyCost)||0};
    }
    var depreciationPerHour = (Number(printer.purchasePrice)||0) / Math.max(1, Number(printer.expectedLifeHours)||1);
    return {depreciationPerHour:depreciationPerHour, maintenancePerHour:maintenancePerHour, hourlyRate: depreciationPerHour + maintenancePerHour};
  }
  function roundPrice(price, rounding, roundingCustom){
    if(rounding === '1') return Math.round(price);
    if(rounding === '5') return Math.round(price/5)*5;
    if(rounding === '10') return Math.round(price/10)*10;
    if(rounding === 'custom'){ var step = Number(roundingCustom)||0; return step>0 ? Math.round(price/step)*step : price; }
    return price;
  }
  /* Central costing engine — pure function, no globals read inside.
     job: calculator/job state (see blankCalc). printer: resolved printer
     record (or a frozen snapshot). materialsById/consumablesById: lookup
     maps. settings: {electricityRate, markups, defaultMarkup, minimumMarginPct}. */
  function computeJobCost(job, printer, materialsById, consumablesById, settings){
    var quantity = Math.max(1, Number(job.quantity)||1);
    var isPlate = job.calcType === 'plate';
    var plates = 1, printTimeUnit = 0;
    if(isPlate){
      var unitsPerPlate = Math.max(1, Number(job.unitsPerPlate)||1);
      plates = Math.ceil(quantity / unitsPerPlate);
      printTimeUnit = Number(job.printTimePerPlate)||0;
    } else {
      printTimeUnit = Number(job.printTimeHours)||0;
    }
    var multiplier = isPlate ? plates : 1;
    var totalPrintHours = isPlate ? (printTimeUnit * plates) : printTimeUnit;
    // Waste comes from the slicer in grams (not a %) — entered per plate in "per plate" mode,
    // same as a filament colour's grams, so it scales with the plate count the same way.
    // It's split across colours in proportion to how much of each colour the job actually uses.
    var wasteGramsTotal = (Number(job.wasteGrams)||0) * multiplier;
    var failureAllowancePct = Number(job.failureAllowancePct)||0;

    var rawByMaterial = {}, totalRawG = 0;
    Object.keys(job.filamentGrams || {}).forEach(function(materialId){
      var rawEach = Number(job.filamentGrams[materialId]) || 0;
      if(!rawEach) return;
      if(!materialsById[materialId]) return;
      var rawTotal = rawEach * multiplier;
      rawByMaterial[materialId] = rawTotal;
      totalRawG += rawTotal;
    });

    var filamentLines = [], totalFilamentRawG = 0, totalFilamentCostedG = 0, filamentCost = 0;
    Object.keys(rawByMaterial).forEach(function(materialId){
      var mat = materialsById[materialId];
      var rawTotal = rawByMaterial[materialId];
      var wasteShare = totalRawG > 0 ? wasteGramsTotal * (rawTotal / totalRawG) : 0;
      var costedTotal = (rawTotal + wasteShare) * (1 + failureAllowancePct/100);
      var cost = (costedTotal/1000) * (Number(mat.pricePerKg)||0);
      totalFilamentRawG += rawTotal; totalFilamentCostedG += costedTotal; filamentCost += cost;
      filamentLines.push({materialId:materialId, colour:mat.colour, materialType:mat.materialType, grams:rawTotal, costedGrams:costedTotal, pricePerKg:Number(mat.pricePerKg)||0, cost:cost});
    });

    var electricityRate = Number(settings.electricityRate)||0;
    var powerKw = printer ? (Number(printer.powerWatts)||0)/1000 : 0;
    var electricityCost = totalPrintHours * powerKw * electricityRate;

    var mc = printerMachineRate(printer);
    var machineCost = totalPrintHours * mc.hourlyRate;

    var labourCost = job.labourEnabled ? (Number(job.labourHours)||0) * (Number(job.labourRate)||0) : 0;

    var postProcessingCost = (job.postProcessing||[]).reduce(function(s,p){ return s + (Number(p.amount)||0); }, 0);

    var consumablesLines = [], consumablesCost = 0;
    (job.consumablesUsed||[]).forEach(function(row){
      var c = consumablesById[row.consumableId];
      if(!c) return;
      var qty = Number(row.quantity)||0;
      var unitCost = (Number(c.purchasePrice)||0) / Math.max(1, Number(c.purchaseQuantity)||1);
      var cost = qty * unitCost;
      consumablesCost += cost;
      consumablesLines.push({consumableId:row.consumableId, name:c.name, quantity:qty, unitCost:unitCost, cost:cost});
    });

    var packagingCost = Number(job.packagingAmount)||0;
    var otherCost = (job.otherCosts||[]).reduce(function(s,o){ return s + (Number(o.amount)||0); }, 0);

    var totalCost = filamentCost + electricityCost + machineCost + labourCost + postProcessingCost + consumablesCost + packagingCost + otherCost;
    var costPerUnit = totalCost / quantity;
    var pricing = deriveMarkupsAndStatus(costPerUnit, quantity, job, settings);

    return {
      quantity: quantity, plates: plates, isPlate: isPlate, totalPrintHours: totalPrintHours,
      totalFilamentRawG: totalFilamentRawG, totalFilamentCostedG: totalFilamentCostedG,
      filamentLines: filamentLines, filamentCost: filamentCost,
      electricityCost: electricityCost, electricityRate: electricityRate, powerKw: powerKw,
      machineCost: machineCost, machineHourlyRate: mc.hourlyRate, depreciationPerHour: mc.depreciationPerHour, maintenancePerHour: mc.maintenancePerHour,
      labourCost: labourCost, postProcessingCost: postProcessingCost,
      consumablesLines: consumablesLines, consumablesCost: consumablesCost,
      packagingCost: packagingCost, otherCost: otherCost,
      totalCost: totalCost, costPerUnit: costPerUnit,
      markupRows: pricing.markupRows, customPrice: pricing.customPrice, activeSelection: pricing.activeSelection,
      breakEvenPerUnit: costPerUnit, minMargin: pricing.minMargin, status: pricing.status
    };
  }
  /* Shared by computeJobCost and computeSplitJobCost so markup/margin/break-even math
     lives in exactly one place, whichever costing path produced costPerUnit. */
  function deriveMarkupsAndStatus(costPerUnit, quantity, job, settings){
    var markups = (settings.markups && settings.markups.length) ? settings.markups : [100,125,150,175,200];
    var markupRows = markups.map(function(pct){
      var raw = costPerUnit * (1 + pct/100);
      var priceUnit = roundPrice(raw, job.rounding, job.roundingCustom);
      var profitUnit = priceUnit - costPerUnit;
      return {
        pct: pct, rawPriceUnit: raw, priceUnit: priceUnit, priceTotal: priceUnit*quantity,
        profitUnit: profitUnit, profitTotal: profitUnit*quantity,
        marginPct: priceUnit>0 ? (profitUnit/priceUnit*100) : 0,
        actualMarkupPct: costPerUnit>0 ? (profitUnit/costPerUnit*100) : 0
      };
    });

    var customPrice = null;
    if(job.customPrice !== '' && job.customPrice != null){
      var custPrice = roundPrice(Number(job.customPrice)||0, job.rounding, job.roundingCustom);
      var custProfitUnit = custPrice - costPerUnit;
      customPrice = {
        priceUnit: custPrice, priceTotal: custPrice*quantity,
        profitUnit: custProfitUnit, profitTotal: custProfitUnit*quantity,
        marginPct: custPrice>0 ? (custProfitUnit/custPrice*100) : 0,
        actualMarkupPct: costPerUnit>0 ? (custProfitUnit/costPerUnit*100) : 0
      };
    }

    var defaultRow = markupRows.filter(function(r){ return r.pct === Number(settings.defaultMarkup); })[0] || markupRows[0];
    var activeSelection = customPrice || defaultRow || {priceUnit:0,priceTotal:0,profitUnit:0,profitTotal:0,marginPct:0,actualMarkupPct:0};
    var minMargin = Number(settings.minimumMarginPct)||0;
    var status = 'red';
    if(activeSelection.priceUnit > 0 && activeSelection.marginPct >= minMargin) status = 'green';
    else if(activeSelection.marginPct > 0) status = 'yellow';

    return { markupRows: markupRows, customPrice: customPrice, activeSelection: activeSelection, minMargin: minMargin, status: status };
  }
  /* Splits one order across several printers (e.g. a P2S and an H2C with different build
     plates) and costs each portion against its own machine, then combines them into one
     accurate total. Order-level costs (labour, post-processing, consumables, packaging,
     other) are shared once across the whole order rather than duplicated per printer.
     Reuses computeJobCost per leg (and once for the order-level costs, with printer:null so
     filament/electricity/machine come back zero) rather than re-deriving any formula. */
  function computeSplitJobCost(job, printersById, materialsById, consumablesById, settings){
    var legs = (job.printerSplits && job.printerSplits.length) ? job.printerSplits : [blankPrinterSplitLeg()];
    var gramsPerUnit = job.filamentGrams || {};
    var failureAllowancePct = Number(job.failureAllowancePct)||0;

    var legResults = legs.map(function(leg){
      var printer = printersById[leg.printerId] || null;
      var legQuantity = Math.max(1, Number(leg.quantity)||1);
      var unitsPerPlate = Math.max(1, Number(leg.unitsPerPlate)||1);
      var plates = Math.ceil(legQuantity / unitsPerPlate);
      var legFilamentGrams = {};
      Object.keys(gramsPerUnit).forEach(function(mid){
        var perUnit = Number(gramsPerUnit[mid])||0;
        if(perUnit) legFilamentGrams[mid] = perUnit * legQuantity;
      });
      var legJob = {
        calcType: 'single', quantity: legQuantity, filamentGrams: legFilamentGrams,
        wasteGrams: (Number(leg.wasteGrams)||0) * plates, failureAllowancePct: failureAllowancePct,
        printTimeHours: plates * (Number(leg.printTimePerPlate)||0),
        labourEnabled: false, postProcessing: [], consumablesUsed: [], packagingAmount: 0, otherCosts: [],
        customPrice: '', rounding: 'none', roundingCustom: ''
      };
      var r = computeJobCost(legJob, printer, materialsById, {}, settings);
      return {
        printerId: leg.printerId, printerName: printer ? printer.name : '(no printer selected)',
        quantity: legQuantity, unitsPerPlate: unitsPerPlate, plates: plates,
        printTimePerPlate: Number(leg.printTimePerPlate)||0, totalPrintHours: r.totalPrintHours,
        wasteGramsPerPlate: Number(leg.wasteGrams)||0,
        filamentLines: r.filamentLines, filamentCost: r.filamentCost,
        electricityCost: r.electricityCost, machineCost: r.machineCost, machineHourlyRate: r.machineHourlyRate
      };
    });

    var orderLevelJob = {
      calcType: 'single', quantity: 1, filamentGrams: {}, wasteGrams: 0, failureAllowancePct: 0, printTimeHours: 0,
      labourEnabled: !!job.labourEnabled, labourHours: job.labourHours, labourRate: job.labourRate,
      postProcessing: job.postProcessing, consumablesUsed: job.consumablesUsed, packagingAmount: job.packagingAmount, otherCosts: job.otherCosts,
      customPrice: '', rounding: 'none', roundingCustom: ''
    };
    var orderR = computeJobCost(orderLevelJob, null, materialsById, consumablesById, settings);

    var quantity = legResults.reduce(function(s,l){ return s + l.quantity; }, 0) || 1;
    var totalPrintHours = legResults.reduce(function(s,l){ return s + l.totalPrintHours; }, 0);
    var filamentCost = legResults.reduce(function(s,l){ return s + l.filamentCost; }, 0);
    var electricityCost = legResults.reduce(function(s,l){ return s + l.electricityCost; }, 0);
    var machineCost = legResults.reduce(function(s,l){ return s + l.machineCost; }, 0);

    var filamentLinesById = {};
    legResults.forEach(function(leg){
      leg.filamentLines.forEach(function(l){
        var existing = filamentLinesById[l.materialId];
        if(existing){
          existing.grams += l.grams; existing.costedGrams += l.costedGrams; existing.cost += l.cost;
        } else {
          filamentLinesById[l.materialId] = { materialId:l.materialId, colour:l.colour, materialType:l.materialType, grams:l.grams, costedGrams:l.costedGrams, pricePerKg:l.pricePerKg, cost:l.cost };
        }
      });
    });
    var filamentLines = Object.keys(filamentLinesById).map(function(k){ return filamentLinesById[k]; });
    var totalFilamentRawG = filamentLines.reduce(function(s,l){ return s + l.grams; }, 0);
    var totalFilamentCostedG = filamentLines.reduce(function(s,l){ return s + l.costedGrams; }, 0);

    var totalCost = filamentCost + electricityCost + machineCost + orderR.labourCost + orderR.postProcessingCost + orderR.consumablesCost + orderR.packagingCost + orderR.otherCost;
    var costPerUnit = totalCost / quantity;
    var pricing = deriveMarkupsAndStatus(costPerUnit, quantity, job, settings);

    return {
      isSplit: true, legs: legResults,
      quantity: quantity, plates: legResults.reduce(function(s,l){ return s + l.plates; }, 0), isPlate: true, totalPrintHours: totalPrintHours,
      totalFilamentRawG: totalFilamentRawG, totalFilamentCostedG: totalFilamentCostedG,
      filamentLines: filamentLines, filamentCost: filamentCost,
      electricityCost: electricityCost, electricityRate: Number(settings.electricityRate)||0, powerKw: 0,
      machineCost: machineCost, machineHourlyRate: 0, depreciationPerHour: 0, maintenancePerHour: 0,
      labourCost: orderR.labourCost, postProcessingCost: orderR.postProcessingCost,
      consumablesLines: orderR.consumablesLines, consumablesCost: orderR.consumablesCost,
      packagingCost: orderR.packagingCost, otherCost: orderR.otherCost,
      totalCost: totalCost, costPerUnit: costPerUnit,
      markupRows: pricing.markupRows, customPrice: pricing.customPrice, activeSelection: pricing.activeSelection,
      breakEvenPerUnit: costPerUnit, minMargin: pricing.minMargin, status: pricing.status
    };
  }
  function calcMaterialsById(){ var m={}; materials.forEach(function(x){ m[x.id]=x; }); return m; }
  function calcConsumablesById(){ var m={}; consumables.forEach(function(x){ m[x.id]=x; }); return m; }
  function calcPrintersById(){ var m={}; printers.forEach(function(x){ m[x.id]=x; }); return m; }
  function calcResult(){
    if(!calc) calc = blankCalc();
    if(calc.splitEnabled){
      return computeSplitJobCost(calc, calcPrintersById(), calcMaterialsById(), calcConsumablesById(), spSettings);
    }
    var printer = printers.find(function(p){ return p.id === calc.printerId; }) || null;
    return computeJobCost(calc, printer, calcMaterialsById(), calcConsumablesById(), spSettings);
  }

  /* ---------------- Solid Prints quotes ----------------
     A quote is a single, self-contained Firestore doc: the calculator's
     inputs PLUS the full computeJobCost() breakdown, copied out as plain
     values at save time. Because computeJobCost() never holds onto a
     reference to a printer/material/consumable record, everything it
     returns (prices, rates, costs) is already a frozen snapshot the moment
     it's returned — so if a filament price changes next month, every quote
     saved before that keeps showing the price that was actually used. */
  function freezeQuoteFromCalc(){

      // Frozen per-printer breakdown (only when isSplit) — what each machine actually
      // contributed, for the quote's own display and for the Dashboard's per-printer
      // utilisation, which attributes totalPrintHours back to the right printer.
      legs: isSplit ? r.legs.map(function(l){ return {
        printerId: l.printerId, printerName: l.printerName, quantity: l.quantity, unitsPerPlate: l.unitsPerPlate,
        plates: l.plates, printTimePerPlate: l.printTimePerPlate, totalPrintHours: l.totalPrintHours,
        wasteGramsPerPlate: l.wasteGramsPerPlate, filamentCost: l.filamentCost, electricityCost: l.electricityCost,
        machineCost: l.machineCost, machineHourlyRate: l.machineHourlyRate
      }; }) : [],
      printerSplitsInput: isSplit ? JSON.parse(JSON.stringify(calc.printerSplits || [])) : [],
      filamentLines: r.filamentLines, filamentGramsInput: JSON.parse(JSON.stringify(calc.filamentGrams || {})),
      wasteGrams: Number(calc.wasteGrams)||0, failureAllowancePct: Number(calc.failureAllowancePct)||0,
      totalFilamentRawG: r.totalFilamentRawG, totalFilamentCostedG: r.totalFilamentCostedG, filamentCost: r.filamentCost,
      electricityRateSnapshot: r.electricityRate, electricityCost: r.electricityCost,
      machineCost: r.machineCost, machineHourlyRate: r.machineHourlyRate,
      labourEnabled: !!calc.labourEnabled, labourHours: Number(calc.labourHours)||0, labourRateSnapshot: Number(calc.labourRate)||0, labourCost: r.labourCost,
      postProcessing: (calc.postProcessing||[]).map(function(p){ return {description:p.description||'', amount:Number(p.amount)||0}; }), postProcessingCost: r.postProcessingCost,
      consumablesUsed: r.consumablesLines.map(function(l){ return {consumableId:l.consumableId, name:l.name, quantity:l.quantity, unitCostSnapshot:l.unitCost, cost:l.cost}; }), consumablesCost: r.consumablesCost,
      packagingCost: r.packagingCost,
      otherCosts: (calc.otherCosts||[]).map(function(o){ return {description:o.description||'', amount:Number(o.amount)||0}; }), otherCost: r.otherCost,
      totalCost: r.totalCost, costPerUnit: r.costPerUnit,
      rounding: calc.rounding, roundingCustom: Number(calc.roundingCustom)||0,

  function makeDocRef(path){
    var ref = firestore.doc(path);
    return {
      id: ref.id,
      path: path,

      set: function(data){ return ref.set(data); },
      update: function(data){ return ref.update(data); },
      delete: function(){ return ref.delete(); },
      onSnapshot: function(next){
        return ref.onSnapshot(function(snap){ next(toDocSnap(snap)); }, function(err){ console.error('onSnapshot', path, err); });
      },
      collection: function(sub){ return makeCollectionRef(path + '/' + sub); }
    };
  }

      add: function(data){ return ref.add(data).then(function(docRef){ return makeDocRef(collPath + '/' + docRef.id); }); },

  function setupSubscriptions(){
    dbNS = { doc: function(p){ return makeDocRef(userPath(p)); }, collection: function(p){ return makeCollectionRef(userPath(p)); } };
    unsubscribers.push(dbNS.doc('settings/business').onSnapshot(function(snap){
      business = snap.exists ? Object.assign(defaultBusiness(), snap.data()) : defaultBusiness();
      render();
    }));
    unsubscribers.push(dbNS.doc('settings/solidPrints').onSnapshot(function(snap){
      spSettings = snap.exists ? Object.assign(defaultSpSettings(), snap.data()) : defaultSpSettings();
      render();
    }));
    unsubscribers.push(dbNS.collection('printers').onSnapshot(function(qs){
      printers = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      printers.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
      render();
    }));
    unsubscribers.push(dbNS.collection('materials').onSnapshot(function(qs){
      materials = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      materials.sort(function(a,b){ return (a.materialType||'').localeCompare(b.materialType||'') || (a.colour||'').localeCompare(b.colour||''); });
      render();
    }));
    unsubscribers.push(dbNS.collection('consumables').onSnapshot(function(qs){
      consumables = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      consumables.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
      render();
    }));
    unsubscribers.push(dbNS.collection('clients').onSnapshot(function(qs){
      clients = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      clients.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
      render();
    }));
    unsubscribers.push(dbNS.collection('documents').onSnapshot(function(qs){
      docs = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      docs.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
      render();
    }));
    unsubscribers.push(dbNS.collection('reports').onSnapshot(function(qs){
      reports = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }));
    unsubscribers.push(dbNS.doc('counters/invoice').onSnapshot(function(snap){
      counters.invoice = snap.exists ? (snap.data().next || 1) : 1;
    }));
    unsubscribers.push(dbNS.doc('counters/quote').onSnapshot(function(snap){
      counters.quote = snap.exists ? (snap.data().next || 1) : 1;
    }));
    unsubscribers.push(dbNS.doc('counters/spquote').onSnapshot(function(snap){
      counters.spquote = snap.exists ? (snap.data().next || 1) : 1;
    }));
    unsubscribers.push(dbNS.collection('spQuotes').onSnapshot(function(qs){
      spQuotes = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      spQuotes.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
      render();
    }));
  }

    business = defaultBusiness(); clients = []; docs = []; reports = []; counters = {invoice:1, quote:1, spquote:1};
    spSettings = defaultSpSettings(); calc = null; calcAdvancedOpen = false; calcEditingQuoteId = null; printers = []; materials = []; consumables = [];

  function friendlyAuthError(err){
    var map = {
      'auth/invalid-email': "That email address doesn't look right.",
      'auth/user-not-found': 'No account with that email.',
      'auth/wrong-password': 'Wrong password.',
      'auth/invalid-credential': 'Email or password is incorrect.',
      'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
      'auth/network-request-failed': 'Could not reach the server — check your connection.'
    };
    return (err && map[err.code]) || (err && err.message) || 'Something went wrong. Try again.';
  }

  function nextNumber(kind){
    var n = kind === 'invoice' ? counters.invoice : counters.quote;
    var prefix = kind === 'invoice' ? 'INV-' : 'QUO-';
    return prefix + pad4(n);
  }
  function bumpCounter(kind){
    var n = (kind === 'invoice' ? counters.invoice : counters.quote) + 1;
    if(kind === 'invoice'){ counters.invoice = n; } else { counters.quote = n; }
    if(dbNS) dbNS.doc('counters/' + kind).set({ next: n });
  }

  /* ---------------- navigation ---------------- */
  function go(name, params){
    view = { name: name, params: params || {} };
    uiConfirm = null;
    if(name === 'newDoc'){
      if(params && params.editId){
        draft = loadDraftFrom(docs.find(function(d){ return d.id === params.editId; }));
      } else {
        draft = blankDraft(params && params.kind || 'invoice');
        if(params && params.prefillItem) draft.items = [params.prefillItem];
        if(params && params.clientId) draft.clientId = params.clientId;
      }
    }
    if(name === 'reportBuilder'){
      if(params && params.editId){
        reportDraft = loadReportDraftFrom(reports.find(function(r){ return r.id === params.editId; }));
      } else {
        reportDraft = blankReportDraft();
        if(params && params.clientId) reportDraft.clientId = params.clientId;
      }

    window.scrollTo(0,0);
    render();

  /* ---------------- document editor model ---------------- */
  function blankDraft(kind){
    return {
      id: null,
      kind: kind,
      status: 'Draft',
      number: null,
      clientId: '',
      clientSnapshot: null,
      dateIssued: todayISO(),
      dateDue: kind === 'invoice' ? addDays(todayISO(), 7) : addDays(todayISO(), 14),
      items: [ {description:'', qty:1, unitPrice:0} ],
      vatEnabled: false,
      notes: kind === 'invoice' ? 'Payment due within 7 days of the invoice date. Thank you for your business.' : 'This quote is valid for 14 days from the date above.',
      createdAt: null,
      convertedToInvoice: null,
      fromQuote: null
    };
  }
  function loadDraftFrom(d){
    if(!d) return blankDraft('invoice');
    var copy = JSON.parse(JSON.stringify(d));
    if(!copy.items || !copy.items.length) copy.items = [{description:'', qty:1, unitPrice:0}];
    return copy;
  }
  function draftTotals(){
    var subtotal = (draft.items||[]).reduce(function(sum, it){ return sum + (Number(it.qty)||0) * (Number(it.unitPrice)||0); }, 0);
    var vat = draft.vatEnabled ? subtotal * 0.15 : 0;
    return { subtotal: subtotal, vat: vat, total: subtotal + vat };
  }
  function docTotals(d){
    var subtotal = (d.items||[]).reduce(function(sum, it){ return sum + (Number(it.qty)||0) * (Number(it.unitPrice)||0); }, 0);
    var vat = d.vatEnabled ? subtotal * 0.15 : 0;
    return { subtotal: subtotal, vat: vat, total: subtotal + vat };
  }

  function saveDraft(){
    if(!dbNS) return;
    if(!draft.clientId){ alertBanner('Choose a client before saving.'); return; }
    var client = clients.find(function(c){ return c.id === draft.clientId; });
    draft.clientSnapshot = client ? {name:client.name, company:client.company, email:client.email, phone:client.phone, address:client.address, vatNumber:client.vatNumber} : draft.clientSnapshot;
    draft.items = (draft.items||[]).filter(function(it){ return (it.description||'').trim() !== '' || Number(it.unitPrice) || Number(it.qty) !== 1; });
    if(!draft.items.length) draft.items = [{description:'Services rendered', qty:1, unitPrice:0}];

    if(!draft.id){
      draft.number = nextNumber(draft.kind);
      draft.createdAt = new Date().toISOString();
      var toSave = Object.assign({}, draft); delete toSave.id;
      dbNS.collection('documents').add(toSave).then(function(ref){
        bumpCounter(draft.kind);
        go('viewDoc', {id: ref.id});
      });
    } else {
      var id = draft.id;
      var toSave2 = Object.assign({}, draft); delete toSave2.id;
      dbNS.doc('documents/' + id).set(toSave2).then(function(){
        go('viewDoc', {id: id});
      });
    }
  }

  function convertToInvoice(q){
    var inv = JSON.parse(JSON.stringify(q));
    inv.id = null; inv.kind = 'invoice'; inv.status = 'Draft'; inv.number = null; inv.createdAt = null;
    inv.dateIssued = todayISO(); inv.dateDue = addDays(todayISO(), 7);
    inv.fromQuote = q.number; inv.convertedToInvoice = null;
    if(!dbNS) return;
    inv.number = nextNumber('invoice');
    inv.createdAt = new Date().toISOString();
    var toSave = Object.assign({}, inv); delete toSave.id;
    dbNS.collection('documents').add(toSave).then(function(ref){
      bumpCounter('invoice');
      dbNS.doc('documents/' + q.id).update({convertedToInvoice: inv.number});
      go('viewDoc', {id: ref.id});
    });
  }

  function render(){
    renderTabs();
    var el = document.getElementById('view');
    if(connectState !== 'signed-in'){
      el.innerHTML = renderAuthGate();
      renderModal();
      return;
    }
    var html = '';
    if(banner) html += '<div class="banner">⚠️ ' + esc(banner) + '</div>';
    switch(view.name){
      case 'documents': html += renderDocuments(); break;
      case 'clients': html += renderClients(); break;
      case 'printers': html += renderPrinters(); break;
      case 'materials': html += renderMaterials(); break;
      case 'consumables': html += renderConsumables(); break;
      case 'calculator': html += renderCalculator(); break;
      case 'spquotes': html += renderSpQuotes(); break;
      case 'spQuoteView': html += renderSpQuoteView(); break;
      case 'reports': html += renderReports(); break;
      case 'reportBuilder': html += renderReportBuilder(); break;
      case 'settings': html += renderSettings(); break;
      case 'newDoc': html += renderEditor(); break;
      case 'viewDoc': html += renderDocView(); break;
      default: html += renderDashboard();
    }
    el.innerHTML = html;
    renderModal();
    if(view.name === 'newDoc') wireEditorEvents();
    if(view.name === 'reportBuilder') wireReportBuilderEvents();

    if(view.name === 'spquotes') wireSpQuotesEvents();

  function renderSpDashboardSection(){
    var monthKey = todayISO().slice(0,7);
    var thisMonthQuotes = spQuotes.filter(function(q){ return (q.quoteDate||'').slice(0,7) === monthKey; });
    var completedThisMonth = thisMonthQuotes.filter(function(q){ return q.status==='Completed' || q.status==='Invoiced' || q.status==='Paid'; });
    var printsThisMonth = completedThisMonth.reduce(function(s,q){ return s + (Number(q.quantity)||0); }, 0);
    var revenueThisMonth = completedThisMonth.reduce(function(s,q){ return s + (Number(q.sellingPriceTotal)||0); }, 0);
    var profitThisMonth = completedThisMonth.reduce(function(s,q){ return s + (Number(q.profit)||0); }, 0);

    var activePrinters = printers.filter(function(p){ return p.active !== false; });
    var totalCapacity = activePrinters.reduce(function(s,p){ return s + (Number(p.capacityHoursPerMonth)||0); }, 0);
    var nonCancelledThisMonth = thisMonthQuotes.filter(function(q){ return q.status !== 'Cancelled'; });
    var hoursByPrinter = {};
    nonCancelledThisMonth.forEach(function(q){
      if(q.isSplit){
        (q.legs||[]).forEach(function(l){ hoursByPrinter[l.printerId] = (hoursByPrinter[l.printerId]||0) + (Number(l.totalPrintHours)||0); });
      } else if(q.printerId){
        hoursByPrinter[q.printerId] = (hoursByPrinter[q.printerId]||0) + (Number(q.totalPrintHours)||0);
      }
    });
    var bookedHours = Object.keys(hoursByPrinter).reduce(function(s,k){ return s + hoursByPrinter[k]; }, 0);
    var utilisationPct = totalCapacity > 0 ? Math.min(999, (bookedHours / totalCapacity) * 100) : 0;

    var recentQuotes = spQuotes.slice(0,5);

    var html = '<div class="card card-pad" style="margin-bottom:22px;">';
    html += '<div class="view-head" style="margin-bottom:16px;"><div><h2 style="font-size:16px;">🖨️ Solid Prints — this month</h2>' +

      '<div class="actions-row"><button class="btn btn-primary" data-nav="calculator">+ New quote</button><button class="btn" data-nav="spquotes">View all quotes</button></div></div>';

    html += '<div class="grid grid-4" style="margin-bottom:18px;">' +
      statCard('Prints completed', String(printsThisMonth), '') +
      statCard('Revenue', fmtMoney(revenueThisMonth), 'accent') +
      statCard('Profit', fmtMoney(profitThisMonth), profitThisMonth>=0?'':'warn') +
      statCard('Printer utilisation', totalCapacity>0 ? utilisationPct.toFixed(0)+'%' : '—', utilisationPct>90?'warn':'') +
      '</div>';

    if(activePrinters.length > 1){
      html += '<div class="table-wrap" style="margin-bottom:18px;"><table><thead><tr><th>Printer</th><th class="num-cell">Booked hours</th><th class="num-cell">Capacity</th><th class="num-cell">Utilisation</th></tr></thead><tbody>';
      activePrinters.forEach(function(p){
        var booked = hoursByPrinter[p.id] || 0;
        var capacity = Number(p.capacityHoursPerMonth)||0;
        var pct = capacity > 0 ? (booked/capacity*100) : 0;
        html += '<tr><td>'+esc(p.name)+'</td><td class="num-cell">'+booked.toFixed(1)+'</td><td class="num-cell">'+(capacity||'—')+'</td>' +
          '<td class="num-cell"><span class="badge '+(pct>90?'badge-overdue':(pct>0?'badge-paid':'badge-draft'))+'">'+(capacity>0?pct.toFixed(0)+'%':'—')+'</span></td></tr>';
      });
      html += '</tbody></table></div>';
    }

    if(!recentQuotes.length){
      html += emptyState('🧾','No quotes yet','Build a job in the Calculator and save it as a quote to see it here.', [
        {label:'Open Calculator', nav:'calculator', primary:true}
      ]);

      html += '<div class="table-wrap"><table><thead><tr><th>Quote #</th><th>Date</th><th>Customer</th><th>Job</th><th class="num-cell">Selling price</th><th>Status</th></tr></thead><tbody>';

          '<td class="mono">'+esc(q.quoteNumber)+'</td>' +
          '<td>'+fmtDate(q.quoteDate)+'</td>' +
          '<td>'+esc(spQuoteClientLabel(q))+'</td>' +

          '<td>'+spQuoteStatusBadge(q.status)+'</td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

      '<div class="totals-row"><span>Total cost (order)</span><span class="mono" id="calc-out-custom-cost">'+fmtMoney(r.totalCost)+'</span></div>' +

    /* ---- break-even + order vs unit ---- */

    html += '<div class="card card-pad" style="margin-bottom:18px;">';

    html += '<div class="field-row">';
    html += '<div class="field"><label>Break-even price / unit</label><input type="text" value="'+fmtMoney(r.breakEvenPerUnit)+'" readonly id="calc-out-breakeven"></div>';
    html += '<div class="field"><label>Against minimum margin (' + esc(spSettings.minimumMarginPct) + '%)</label><div style="padding-top:6px;"><span class="badge '+sm.cls+'" id="calc-status-badge">'+sm.label+'</span></div></div>';
    html += '</div>';

    html += '<div class="grid grid-2" style="margin-top:8px;">';
    html += '<div class="card card-pad"><div class="stat-label" style="margin-bottom:10px;">Order (' + r.quantity + ' units)</div>' +
      '<div class="totals-row"><span>Cost</span><span class="mono" id="calc-out-order-cost">'+fmtMoney(r.totalCost)+'</span></div>' +
      '<div class="totals-row"><span>Selling</span><span class="mono" id="calc-out-order-selling">'+fmtMoney(r.activeSelection.priceTotal)+'</span></div>' +
      '<div class="totals-row total"><span>Profit</span><span class="mono" id="calc-out-order-profit">'+fmtMoney(r.activeSelection.profitTotal)+'</span></div></div>';
    html += '<div class="card card-pad"><div class="stat-label" style="margin-bottom:10px;">Per unit</div>' +

      '<div class="totals-row"><span>Selling</span><span class="mono" id="calc-out-unit-selling">'+fmtMoney(r.activeSelection.priceUnit)+'</span></div>' +
      '<div class="totals-row total"><span>Profit</span><span class="mono" id="calc-out-unit-profit">'+fmtMoney(r.activeSelection.profitUnit)+'</span></div></div>';

        '</div>';

        '</div>';
      html += '<p class="hint" style="margin-top:8px;">Uses your custom price if set, otherwise the default markup (' + esc(spSettings.defaultMarkup) + '%). Saving a quote freezes today\'s costs and prices permanently — later changes to your Materials, Printers or Settings will never change a saved quote.</p>';
    }
    html += '</div>';

    return html;
  }
  function costRow(label, id, value){
    return '<div class="totals-row"><span>'+label+'</span><span class="mono" id="'+id+'">'+fmtMoney(value)+'</span></div>';
  }
  function renderCostRowsTable(prefix, rows, descLabel, descPlaceholder){
    if(!rows.length) return '<p class="hint">None added.</p>';
    var html = '<div class="table-wrap"><table><thead><tr><th>'+descLabel+'</th><th class="num-cell">Amount</th><th></th></tr></thead><tbody id="calc-'+prefix+'-body">';
    rows.forEach(function(row,i){
      html += '<tr data-idx="'+i+'">' +
        '<td><input class="calc-cost-desc" type="text" value="'+esc(row.description)+'" placeholder="'+esc(descPlaceholder)+'"></td>' +
        '<td><input class="calc-cost-amount mono" type="number" min="0" step="0.01" value="'+(row.amount||0)+'"></td>' +
        '<td><button type="button" class="btn btn-sm btn-ghost btn-danger" data-remove-cost-row="'+prefix+'" data-idx="'+i+'">✕</button></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }
  function updateCalcOutputs(){
    var r = calcResult();
    var set = function(id, val){ var el = document.getElementById(id); if(el) el.textContent = val; };

    var platesEl = document.getElementById('calc-out-plates'); if(platesEl) platesEl.value = String(r.plates);
    var hoursEl = document.getElementById('calc-out-total-hours'); if(hoursEl) hoursEl.value = r.totalPrintHours.toFixed(2) + ' hours';
    set('calc-split-out-qty', String(r.quantity));
    set('calc-split-out-plates', String(r.plates));
    set('calc-split-out-hours', r.totalPrintHours.toFixed(2));

    var costByMaterial = {};
    r.filamentLines.forEach(function(l){ costByMaterial[l.materialId] = l.cost; });
    materials.forEach(function(m){
      var cell = document.getElementById('calc-fil-cost-'+m.id);
      if(cell) cell.textContent = fmtMoney(costByMaterial[m.id] || 0);
    });
    set('calc-out-filament-raw', r.totalFilamentRawG.toFixed(1) + ' g');
    set('calc-out-filament-costed', r.totalFilamentCostedG.toFixed(1) + ' g');
    set('calc-out-filament-cost', fmtMoney(r.filamentCost));

    var consBody = document.getElementById('calc-consumables-body');
    if(consBody){
      Array.prototype.forEach.call(consBody.querySelectorAll('tr'), function(tr){
        var idx = Number(tr.getAttribute('data-idx'));
        var row = calc.consumablesUsed[idx]; if(!row) return;
        var c = consumables.find(function(x){return x.id===row.consumableId;});
        var unitCost = c ? (Number(c.purchasePrice)||0)/Math.max(1,Number(c.purchaseQuantity)||1) : 0;
        var uc = tr.querySelector('[data-unit-cost]'); if(uc) uc.textContent = fmtMoney(unitCost);
        var rc = tr.querySelector('[data-row-cost]'); if(rc) rc.textContent = fmtMoney((Number(row.quantity)||0)*unitCost);
      });
    }

    set('calc-out-cs-filament', fmtMoney(r.filamentCost));
    set('calc-out-cs-electricity', fmtMoney(r.electricityCost));
    set('calc-out-cs-machine', fmtMoney(r.machineCost));
    set('calc-out-cs-labour', fmtMoney(r.labourCost));
    set('calc-out-cs-pp', fmtMoney(r.postProcessingCost));
    set('calc-out-cs-consumables', fmtMoney(r.consumablesCost));
    set('calc-out-cs-packaging', fmtMoney(r.packagingCost));
    set('calc-out-cs-other', fmtMoney(r.otherCost));
    set('calc-out-total-cost', fmtMoney(r.totalCost));
    set('calc-out-cost-per-unit', fmtMoney(r.costPerUnit));

    var mbody = document.getElementById('calc-markup-body');
    if(mbody){
      r.markupRows.forEach(function(row){
        var tr = mbody.querySelector('tr[data-pct="'+row.pct+'"]'); if(!tr) return;
        var setF = function(f,val){ var el = tr.querySelector('[data-f="'+f+'"]'); if(el) el.textContent = val; };
        setF('priceUnit', fmtMoney(row.priceUnit));
        setF('priceTotal', fmtMoney(row.priceTotal));
        setF('profitUnit', fmtMoney(row.profitUnit));
        setF('marginPct', row.marginPct.toFixed(1)+'%');
      });
    }

    var defaultRow = r.markupRows.filter(function(x){return x.pct===Number(spSettings.defaultMarkup);})[0] || r.markupRows[0];
    set('calc-out-calculated-price', fmtMoney(defaultRow ? defaultRow.priceUnit : 0));

    set('calc-out-custom-revenue', fmtMoney(r.activeSelection.priceTotal));
    set('calc-out-custom-cost', fmtMoney(r.totalCost));
    set('calc-out-custom-profit', fmtMoney(r.activeSelection.profitTotal));
    set('calc-out-custom-markup', r.activeSelection.actualMarkupPct.toFixed(1)+'%');
    set('calc-out-custom-margin', r.activeSelection.marginPct.toFixed(1)+'%');

    var beEl = document.getElementById('calc-out-breakeven'); if(beEl) beEl.value = fmtMoney(r.breakEvenPerUnit);
    var sm = statusMeta(r.status);
    var badge = document.getElementById('calc-status-badge');
    if(badge){ badge.textContent = sm.label; badge.className = 'badge ' + sm.cls; }

    set('calc-out-order-cost', fmtMoney(r.totalCost));
    set('calc-out-order-selling', fmtMoney(r.activeSelection.priceTotal));
    set('calc-out-order-profit', fmtMoney(r.activeSelection.profitTotal));
    set('calc-out-unit-cost', fmtMoney(r.costPerUnit));
    set('calc-out-unit-selling', fmtMoney(r.activeSelection.priceUnit));
    set('calc-out-unit-profit', fmtMoney(r.activeSelection.profitUnit));
  }
  function wireCalculatorEvents(){
    var advancedEl = document.getElementById('calc-advanced');
    if(advancedEl) advancedEl.addEventListener('toggle', function(){ calcAdvancedOpen = this.open; });

    var bindLight = function(id, key, cb){
      var el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', function(){ calc[key] = this.value; updateCalcOutputs(); if(cb) cb(); });
    };
    bindLight('calc-job-name','jobName');
    bindLight('calc-quantity','quantity');
    bindLight('calc-units-per-plate','unitsPerPlate');
    bindLight('calc-print-time-per-plate','printTimePerPlate');
    bindLight('calc-print-time-hours','printTimeHours');
    bindLight('calc-waste-grams','wasteGrams');
    bindLight('calc-failure-pct','failureAllowancePct');
    bindLight('calc-labour-hours','labourHours');
    bindLight('calc-labour-rate','labourRate');
    bindLight('calc-packaging','packagingAmount');
    bindLight('calc-custom-price','customPrice');
    bindLight('calc-rounding-custom','roundingCustom');

    var clientSel = document.getElementById('calc-client');
    if(clientSel) clientSel.addEventListener('change', function(){ calc.clientId = this.value; });

    var printerSel = document.getElementById('calc-printer');
    if(printerSel) printerSel.addEventListener('change', function(){
      calc.printerId = this.value;
      var p = printers.find(function(x){return x.id===calc.printerId;});
      calc.wasteGrams = p ? (Number(p.defaultWasteGrams)||0) : calc.wasteGrams;
      render();
    });

    var calcTypeSel = document.getElementById('calc-calctype');
    if(calcTypeSel) calcTypeSel.addEventListener('change', function(){ calc.calcType = this.value; render(); });

    var splitToggle = document.getElementById('calc-split-enabled');
    if(splitToggle) splitToggle.addEventListener('change', function(){
      calc.splitEnabled = this.checked;
      if(calc.splitEnabled && (!calc.printerSplits || !calc.printerSplits.length)) calc.printerSplits = [blankPrinterSplitLeg()];
      render();
    });

    var splitBody = document.getElementById('calc-split-body');
    if(splitBody){
      splitBody.addEventListener('input', function(e){
        var tr = e.target.closest('tr'); if(!tr) return;
        var idx = Number(tr.getAttribute('data-idx'));
        var leg = calc.printerSplits[idx]; if(!leg) return;
        if(e.target.classList.contains('calc-split-qty')) leg.quantity = e.target.value;
        else if(e.target.classList.contains('calc-split-upp')) leg.unitsPerPlate = e.target.value;
        else if(e.target.classList.contains('calc-split-time')) leg.printTimePerPlate = e.target.value;
        else if(e.target.classList.contains('calc-split-waste')) leg.wasteGrams = e.target.value;
        var platesCell = tr.querySelector('[data-split-plates]');
        if(platesCell) platesCell.textContent = String(Math.ceil(Math.max(1,Number(leg.quantity)||1) / Math.max(1,Number(leg.unitsPerPlate)||1)));
        updateCalcOutputs();
      });
      splitBody.addEventListener('change', function(e){
        if(!e.target.classList.contains('calc-split-printer')) return;
        var tr = e.target.closest('tr'); var idx = Number(tr.getAttribute('data-idx'));
        var leg = calc.printerSplits[idx]; if(!leg) return;
        leg.printerId = e.target.value;
        var p = printers.find(function(x){return x.id===leg.printerId;});
        leg.wasteGrams = p ? (Number(p.defaultWasteGrams)||0) : leg.wasteGrams;
        var wasteInput = tr.querySelector('.calc-split-waste'); if(wasteInput) wasteInput.value = leg.wasteGrams;
        updateCalcOutputs();
      });
    }
    var addSplitBtn = document.getElementById('calc-add-split-leg');
    if(addSplitBtn) addSplitBtn.addEventListener('click', function(){ calc.printerSplits.push(blankPrinterSplitLeg()); render(); });
    document.querySelectorAll('[data-remove-split-leg]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = Number(btn.getAttribute('data-idx'));
        calc.printerSplits.splice(idx,1);
        if(!calc.printerSplits.length) calc.printerSplits.push(blankPrinterSplitLeg());
        render();
      });
    });

    var roundingSel = document.getElementById('calc-rounding');
    if(roundingSel) roundingSel.addEventListener('change', function(){ calc.rounding = this.value; render(); });

    var labourToggle = document.getElementById('calc-labour-enabled');
    if(labourToggle) labourToggle.addEventListener('change', function(){ calc.labourEnabled = this.checked; render(); });

    var filBody = document.getElementById('calc-fil-body');
    if(filBody) filBody.addEventListener('input', function(e){
      if(!e.target.classList.contains('calc-fil-input')) return;
      var mid = e.target.getAttribute('data-material-id');
      calc.filamentGrams[mid] = e.target.value;
      updateCalcOutputs();
    });

    ['pp','other'].forEach(function(prefix){
      var body = document.getElementById('calc-'+prefix+'-body');
      if(body) body.addEventListener('input', function(e){
        var tr = e.target.closest('tr'); if(!tr) return;
        var idx = Number(tr.getAttribute('data-idx'));
        var list = prefix==='pp' ? calc.postProcessing : calc.otherCosts;
        if(!list[idx]) return;
        if(e.target.classList.contains('calc-cost-desc')) list[idx].description = e.target.value;
        if(e.target.classList.contains('calc-cost-amount')) list[idx].amount = Number(e.target.value)||0;
        updateCalcOutputs();
      });
    });

    var consBody = document.getElementById('calc-consumables-body');
    if(consBody){
      consBody.addEventListener('input', function(e){
        var tr = e.target.closest('tr'); if(!tr) return;
        var idx = Number(tr.getAttribute('data-idx'));
        var row = calc.consumablesUsed[idx]; if(!row) return;
        if(e.target.classList.contains('calc-cons-qty')) row.quantity = Number(e.target.value)||0;
        updateCalcOutputs();
      });
      consBody.addEventListener('change', function(e){
        if(!e.target.classList.contains('calc-cons-select')) return;
        var tr = e.target.closest('tr'); var idx = Number(tr.getAttribute('data-idx'));
        var row = calc.consumablesUsed[idx]; if(!row) return;
        row.consumableId = e.target.value;
        updateCalcOutputs();
      });
    }

    document.querySelectorAll('[data-add-cost-row]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var type = btn.getAttribute('data-add-cost-row');
        if(type==='pp') calc.postProcessing.push({description:'', amount:0});
        else if(type==='other') calc.otherCosts.push({description:'', amount:0});
        else if(type==='consumable') calc.consumablesUsed.push({consumableId: (consumables.filter(function(c){return c.active!==false;})[0]||{}).id || '', quantity:1});
        render();
      });
    });
    document.querySelectorAll('[data-remove-cost-row]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var type = btn.getAttribute('data-remove-cost-row');
        var idx = Number(btn.getAttribute('data-idx'));
        if(type==='pp') calc.postProcessing.splice(idx,1);
        else if(type==='other') calc.otherCosts.splice(idx,1);
        else if(type==='consumable') calc.consumablesUsed.splice(idx,1);
        render();
      });
    });

    document.querySelectorAll('[data-use-markup]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pct = Number(btn.getAttribute('data-use-markup'));
        var row = calcResult().markupRows.filter(function(x){return x.pct===pct;})[0];
        if(row){ calc.customPrice = String(row.priceUnit); render(); }
      });
    });

    var resetBtn = document.getElementById('calc-reset-btn');
    if(resetBtn) resetBtn.addEventListener('click', function(){ calc = blankCalc(); render(); });

    function startDocFromCalc(kind){
      var res = calcResult();
      if(res.activeSelection.priceUnit <= 0){ alertBanner('Enter at least a filament weight or print time first.'); return; }
      var desc = (calc.jobName || '').trim() || '3D printing job';
      var item = { description: desc, qty: res.quantity, unitPrice: Math.round(res.activeSelection.priceUnit * 100) / 100 };
      go('newDoc', { kind: kind, prefillItem: item, clientId: calc.clientId || '' });
    }
    var quoteBtn = document.getElementById('calc-create-quote-btn');
    if(quoteBtn) quoteBtn.addEventListener('click', function(){
      var res = calcResult();
      if(res.activeSelection.priceUnit <= 0){ alertBanner('Enter at least a filament weight or print time first.'); return; }
      saveQuoteFromCalc();
    });
    var cancelEditBtn = document.getElementById('calc-cancel-edit-btn');
    if(cancelEditBtn) cancelEditBtn.addEventListener('click', function(){
      var id = calcEditingQuoteId;
      calcEditingQuoteId = null;
      calc = blankCalc();
      if(id) go('spQuoteView', {id:id}); else render();
    });
    var invoiceBtn = document.getElementById('calc-create-invoice-btn');
    if(invoiceBtn) invoiceBtn.addEventListener('click', function(){ startDocFromCalc('invoice'); });

    updateCalcOutputs();
  }

  var QUOTE_STATUSES = ['Draft','Quoted','Approved','Printing','Completed','Invoiced','Paid','Cancelled'];
  function spQuoteStatusBadge(status){
    var cls = {Draft:'badge-draft', Quoted:'badge-quoted', Approved:'badge-approved', Printing:'badge-printing',
      Completed:'badge-completed', Invoiced:'badge-invoiced', Paid:'badge-paid', Cancelled:'badge-cancelled'}[status] || 'badge-draft';
    return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }
  function spQuoteClientLabel(q){
    var c = q.clientSnapshot;
    if(!c) return '—';
    return c.company ? (c.name + ' · ' + c.company) : c.name;
  }
  function spQuoteUsesPrinter(q, printerId){
    if(!printerId) return true;
    if(q.isSplit) return (q.legs||[]).some(function(l){ return l.printerId === printerId; });
    return q.printerId === printerId;
  }
  function spQuotePrinterLabel(q){
    if(q.isSplit) return (q.legs||[]).map(function(l){ return l.printerName; }).join(' + ') || 'Split';
    return q.printerSnapshot ? q.printerSnapshot.name : '—';
  }
  function filteredSpQuotes(){
    return spQuotes.filter(function(q){
      if(quoteFilter.status && q.status !== quoteFilter.status) return false;
      if(quoteFilter.clientId && q.clientId !== quoteFilter.clientId) return false;
      if(quoteFilter.printerId && !spQuoteUsesPrinter(q, quoteFilter.printerId)) return false;
      if(quoteFilter.from && q.quoteDate < quoteFilter.from) return false;
      if(quoteFilter.to && q.quoteDate > quoteFilter.to) return false;
      if(quoteFilter.minProfit !== '' && quoteFilter.minProfit != null && Number(q.profit) < Number(quoteFilter.minProfit)) return false;
      if(quoteFilter.maxProfit !== '' && quoteFilter.maxProfit != null && Number(q.profit) > Number(quoteFilter.maxProfit)) return false;
      return true;
    });
  }

  function downloadSpQuotePdf(q){
    if(quotePdfBusy) return;
    var el = document.querySelector('.sheet');
    if(!el) return;
    if(!window.html2pdf){
      alertBanner('Could not load the PDF tool — printing instead.');
      window.print();
      return;
    }
    quotePdfBusy = q.id;
    render();
    var opt = {
      margin: 0,
      filename: (q.quoteNumber || 'quote') + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    window.html2pdf().set(opt).from(el).save().then(function(){
      quotePdfBusy = null;
      render();
    }).catch(function(){
      quotePdfBusy = null;
      alertBanner('Could not generate the PDF — try Print instead.');
      render();
    });
  }

  function wireEditorEvents(){
    var kindSel = document.getElementById('f-kind');
    if(kindSel) kindSel.addEventListener('change', function(){ draft.kind = this.value; render(); wireEditorEvents(); });

    var clientSel = document.getElementById('f-client');
    if(clientSel) clientSel.addEventListener('change', function(){ draft.clientId = this.value; });

    var dueEl = document.getElementById('f-due');
    if(dueEl) dueEl.addEventListener('change', function(){ draft.dateDue = this.value; });
    var issuedEl = document.getElementById('f-issued');
    if(issuedEl) issuedEl.addEventListener('change', function(){ draft.dateIssued = this.value; });
    var vatEl = document.getElementById('f-vat');
    if(vatEl) vatEl.addEventListener('change', function(){ draft.vatEnabled = this.checked; render(); wireEditorEvents(); });
    var notesEl = document.getElementById('f-notes');
    if(notesEl) notesEl.addEventListener('input', function(){ draft.notes = this.value; });

    document.getElementById('items-body').addEventListener('input', function(e){
      var tr = e.target.closest('tr'); if(!tr) return;
      var idx = Number(tr.getAttribute('data-idx'));
      if(e.target.classList.contains('it-desc')) draft.items[idx].description = e.target.value;
      if(e.target.classList.contains('it-qty')) draft.items[idx].qty = Number(e.target.value)||0;
      if(e.target.classList.contains('it-price')) draft.items[idx].unitPrice = Number(e.target.value)||0;
      var lt = (Number(draft.items[idx].qty)||0) * (Number(draft.items[idx].unitPrice)||0);
      tr.querySelector('[data-line-total]').textContent = fmtMoney(lt);
      updateTotalsDisplay();
    });

    document.getElementById('add-item-btn').addEventListener('click', function(){
      draft.items.push({description:'', qty:1, unitPrice:0});
      render(); wireEditorEvents();
    });
    document.getElementById('items-body').addEventListener('click', function(e){
      var btn = e.target.closest('[data-remove-item]'); if(!btn) return;
      var idx = Number(btn.getAttribute('data-remove-item'));
      if(draft.items.length>1){ draft.items.splice(idx,1); render(); wireEditorEvents(); }
    });

    var addClientLink = document.getElementById('add-client-inline');
    if(addClientLink) addClientLink.addEventListener('click', function(e){ e.preventDefault(); modal = {type:'client', editingId:null, returnToEditor:true}; render(); });

    var saveBtn = document.getElementById('save-doc-btn');
    if(saveBtn) saveBtn.addEventListener('click', saveDraft);
  }

  function downloadPdf(d){
    if(pdfBusy) return;
    var el = document.querySelector('.sheet');
    if(!el){ return; }
    if(!window.html2pdf){
      alertBanner('Could not load the PDF tool — printing instead.');
      window.print();
      return;
    }
    pdfBusy = d.id;
    render();
    var opt = {
      margin: 0,
      filename: (d.number || 'document') + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    window.html2pdf().set(opt).from(el).save().then(function(){
      pdfBusy = null;
      render();
    }).catch(function(){
      pdfBusy = null;
      alertBanner('Could not generate the PDF — try Print instead.');
      render();
    });
  }

  /* ---------- reports ---------- */
  function monthLabel(key){
    if(!key) return '';
    var parts = key.split('-');
    if(parts.length !== 2) return key;
    var d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    if(isNaN(d)) return key;
    return d.toLocaleDateString('en-ZA', {month:'long', year:'numeric'});
  }
  function blankGbp(){ return { totalCur:'', totalPrev:'', viewsCur:'', viewsPrev:'', callsCur:'', callsPrev:'', dirCur:'', dirPrev:'', clicksCur:'', clicksPrev:'' }; }
  function blankWeb(){ return { visitorsCur:'', visitorsPrev:'' }; }
  function blankSummit(){ return { show:true, stage:2, reason:'', note:'' }; }
  function blankReportDraft(){
    return {
      id: null,
      clientId: '',
      periodKey: '',
      prevPeriodKey: '',
      companyName: business.legalName || '',
      gbp: blankGbp(),
      web: blankWeb(),
      queries: [ {text:'',clicks:'',impr:''}, {text:'',clicks:'',impr:''}, {text:'',clicks:'',impr:''} ],
      content: [ {title:'',pv:'',sess:'',eng:'',dur:''}, {title:'',pv:'',sess:'',eng:'',dur:''}, {title:'',pv:'',sess:'',eng:'',dur:''} ],
      summit: blankSummit()
    };
  }
  function loadReportDraftFrom(r){
    if(!r) return blankReportDraft();
    var copy = JSON.parse(JSON.stringify(r));
    copy.gbp = Object.assign(blankGbp(), copy.gbp||{});
    copy.web = Object.assign(blankWeb(), copy.web||{});
    if(!copy.queries || !copy.queries.length) copy.queries = [{text:'',clicks:'',impr:''}];
    if(!copy.content || !copy.content.length) copy.content = [{title:'',pv:'',sess:'',eng:'',dur:''}];
    copy.summit = Object.assign(blankSummit(), copy.summit||{});
    return copy;
  }
  function findPreviousReport(clientId, periodKey){
    if(!clientId || !periodKey) return null;
    var candidates = reports.filter(function(r){
      return r.clientId === clientId && r.periodKey && r.periodKey < periodKey && (!reportDraft || r.id !== reportDraft.id);
    });
    if(!candidates.length) return null;
    candidates.sort(function(a,b){ return b.periodKey.localeCompare(a.periodKey); });
    return candidates[0];
  }
  function applyPreviousReportAutofill(){
    if(!reportDraft.clientId || !reportDraft.periodKey) return;
    var prev = findPreviousReport(reportDraft.clientId, reportDraft.periodKey);
    if(prev){
      reportDraft.prevPeriodKey = prev.periodKey;
      reportDraft.gbp.totalPrev = (prev.gbp||{}).totalCur || '';
      reportDraft.gbp.viewsPrev = (prev.gbp||{}).viewsCur || '';
      reportDraft.gbp.callsPrev = (prev.gbp||{}).callsCur || '';
      reportDraft.gbp.dirPrev = (prev.gbp||{}).dirCur || '';
      reportDraft.gbp.clicksPrev = (prev.gbp||{}).clicksCur || '';
      reportDraft.web.visitorsPrev = (prev.web||{}).visitorsCur || '';
      alertBanner("Filled in last period's figures from " + monthLabel(prev.periodKey) + '.');
    }
  }

  function saveReport(){
    if(!dbNS) return;
    if(!reportDraft.clientId){ alertBanner('Choose a client before saving.'); return; }
    if(!reportDraft.periodKey){ alertBanner('Choose a reporting period before saving.'); return; }
    var client = clients.find(function(c){ return c.id === reportDraft.clientId; });
    var nowIso = new Date().toISOString();
    var toSave = {
      clientId: reportDraft.clientId,
      clientName: client ? (client.company ? client.name + ' · ' + client.company : client.name) : (reportDraft.clientName || ''),
      periodKey: reportDraft.periodKey,
      periodLabel: monthLabel(reportDraft.periodKey),
      prevPeriodKey: reportDraft.prevPeriodKey || '',
      prevPeriodLabel: monthLabel(reportDraft.prevPeriodKey),
      companyName: reportDraft.companyName || business.legalName || '',
      gbp: reportDraft.gbp,
      web: reportDraft.web,
      queries: reportDraft.queries,
      content: reportDraft.content,
      summit: reportDraft.summit,
      createdAt: reportDraft.createdAt || nowIso,
      updatedAt: nowIso
    };
    if(!reportDraft.id){
      dbNS.collection('reports').add(toSave).then(function(ref){
        reportDraft.id = ref.id;
        reportDraft.createdAt = toSave.createdAt;
        alertBanner('Report saved.');
      });
    } else {
      dbNS.doc('reports/' + reportDraft.id).set(toSave).then(function(){
        alertBanner('Report saved.');
      });
    }
  }
  function deleteReport(id){
    if(!dbNS) return;
    dbNS.doc('reports/' + id).delete();
    if(view.name === 'reportBuilder' && reportDraft && reportDraft.id === id) go('reports');
  }
