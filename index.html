e-columns:repeat(4,1fr); gap:16px; margin-top:32px; position:relative; z-index:2; }\n    .hero-kpi { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.16); border-radius:10px; padding:16px 18px; }\n    .hero-kpi .label { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:rgba(255,255,255,0.6); margin-bottom:6px; }\n    .hero-kpi .value { font-size:24px; font-weight:700; }\n    .hero-kpi .delta { font-size:12px; font-weight:600; margin-top:4px; }\n    .up { color:#7FE0B6; } .down { color:#FF9776; }\n    .section { padding:40px 48px; }\n    .section-title { font-size:20px; font-weight:700; margin:0 0 4px; }\n    .section-sub { color:var(--bp-muted); font-size:13.5px; margin:0 0 24px; }\n    .summit-card { background:var(--bp-card); border:1px solid var(--bp-border); border-radius:14px; padding:32px 32px 24px; }\n    .summit-track { display:flex; align-items:flex-end; justify-content:space-between; gap:6px; height:130px; position:relative; margin-bottom:18px; }\n    .s-stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; }\n    .s-peak { width:100%; max-width:84px; background:var(--bp-bg); border:2px solid var(--bp-border); border-bottom:none; clip-path:polygon(50% 0%, 100% 100%, 0% 100%); }\n    .s-stage:nth-child(1) .s-peak { height:34px; } .s-stage:nth-child(2) .s-peak { height:54px; } .s-stage:nth-child(3) .s-peak { height:74px; }\n    .s-stage:nth-child(4) .s-peak { height:96px; } .s-stage:nth-child(5) .s-peak { height:118px; }\n    .s-stage.done .s-peak { background:#EFE7F7; border-color:var(--bp-accent); }\n    .s-stage.current .s-peak { background:var(--bp-accent); border-color:var(--bp-primary-dark); box-shadow:0 0 0 5px rgba(91,44,145,0.12); }\n    .s-flag { position:absolute; top:-22px; font-size:16px; }\n    .s-stage:not(.current) .s-flag { display:none; }\n    .s-name { font-size:12.5px; font-weight:700; color:var(--bp-text); margin-top:12px; text-align:center; }\n    .s-desc { font-size:11px; color:var(--bp-muted); margin-top:3px; text-align:center; padding:0 4px; }\n    .s-stage.current .s-name { color:var(--bp-accent); }\n    .summit-note { margin-top:20px; background:var(--bp-bg); border-left:3px solid var(--bp-gold); padding:14px 18px; border-radius:0 8px 8px 0; font-size:13.5px; color:var(--bp-text); }\n    .summit-note b { color:var(--bp-primary-dark); }\n    .panel-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }\n    .panel-grid.cols-2 { grid-template-columns:repeat(2,1fr); }\n    .panel { background:var(--bp-card); border:1px solid var(--bp-border); border-radius:12px; padding:18px 20px; }\n    .p-label { font-size:12px; color:var(--bp-muted); margin-bottom:8px; }\n    .p-value { font-size:26px; font-weight:700; color:var(--bp-primary-dark); }\n    .p-delta { font-size:12.5px; font-weight:600; margin-top:6px; }\n    .p-context { font-size:11.5px; color:var(--bp-muted); margin-top:6px; }\n    .card { background:var(--bp-card); border:1px solid var(--bp-border); border-radius:12px; padding:22px 24px; margin-bottom:18px; }\n    .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }\n    .card-head h3 { margin:0; font-size:15px; font-weight:700; }\n    .tag { font-size:11px; font-weight:600; color:var(--bp-accent); background:#EFE7F7; padding:4px 10px; border-radius:20px; }\n    table { width:100%; border-collapse:collapse; font-size:13px; }\n    th { text-align:left; color:var(--bp-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; padding:8px 6px; border-bottom:1px solid var(--bp-border); }\n    td { padding:9px 6px; border-bottom:1px solid var(--bp-border); }\n    th.num, td.num { text-align:right; }\n    .footer { display:flex; justify-content:space-between; padding:24px 48px 40px; font-size:11.5px; color:var(--bp-muted); }\n    @media (max-width:720px) {\n      .hero, .section { padding-left:20px; padding-right:20px; }\n      .hero-kpis, .panel-grid { grid-template-columns:1fr; }\n    }\n  ";

  function rptNum(s){ var n = parseFloat((s||'').toString().replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; }
  function rptPctChange(cur, prev){
    var c = rptNum(cur), p = rptNum(prev);
    if(c === null || p === null || p === 0) return null;
    return ((c - p) / p) * 100;
  }
  function rptDeltaHtml(cur, prev, prevLabel){
    var pct = rptPctChange(cur, prev);
    if(pct === null) return { cls:'up', text:'' };
    var cls = pct >= 0 ? 'up' : 'down';
    var arrow = pct >= 0 ? '▲' : '▼';
    return { cls: cls, text: arrow + ' ' + Math.abs(pct).toFixed(1) + '% vs. last period (' + esc(prevLabel) + ')' };
  }
  function rptDeltaHtmlPlain(cur, prev){
    var pct = rptPctChange(cur, prev);
    if(pct === null) return { cls:'up', text:'' };
    var cls = pct >= 0 ? 'up' : 'down';
    var arrow = pct >= 0 ? '▲' : '▼';
    return { cls: cls, text: arrow + ' ' + Math.abs(pct).toFixed(1) + '% (' + esc(prev) + ' → ' + esc(cur) + ')' };
  }

  function buildReportBody(model, clientName){
    var companyName = model.companyName || business.legalName || '[[Your Company]]';
    clientName = clientName || '[[Client Name]]';
    var periodCur = monthLabel(model.periodKey) || '[[This period]]';
    var periodPrev = monthLabel(model.prevPeriodKey) || '';
    var g = model.gbp || blankGbp(), w = model.web || blankWeb();

    var heroDefs = [
      { label:'Total Interactions', cur:g.totalCur, prev:g.totalPrev },
      { label:'Website Visitors (28d)', cur:w.visitorsCur, prev:w.visitorsPrev },
      { label:'Profile Views (Search)', cur:g.viewsCur, prev:g.viewsPrev },
      { label:'Calls', cur:g.callsCur, prev:g.callsPrev }
    ];
    var heroKpiHtml = heroDefs.map(function(k){
      var d = rptDeltaHtml(k.cur, k.prev, periodPrev);
      return '<div class="hero-kpi"><div class="label">'+esc(k.label)+'</div><div class="value">'+esc(k.cur)+'</div><div class="delta '+d.cls+'">'+d.text+'</div></div>';
    }).join('');

    var showSummit = !!(model.summit && model.summit.show);
    var summitSection = '';
    if(showSummit){
      var stageNames = ['Foundation','Visibility','Engagement &amp; Lead Growth','Conversion Optimisation','Market Authority'];
      var stageDescs = ['Site live, tracking connected','Branded search &amp; local presence set','','Tightening the funnel before scaling further','Market-leading local presence'];
      var curStage = Number(model.summit.stage) || 0;
      var summitHtml = stageNames.map(function(name, i){
        var cls = '';
        if(i < curStage) cls = 'done';
        if(i === curStage) cls = 'current';
        var desc = i === curStage ? esc(model.summit.reason) : stageDescs[i];
        var flag = i === curStage ? '<div class="s-flag">🚩</div>' : '';
        return '<div class="s-stage '+cls+'">'+flag+'<div class="s-peak"></div><div class="s-name">'+name+'</div><div class="s-desc">'+desc+'</div></div>';
      }).join('');
      summitSection = '<div class="section"><div class="section-title">Growth Summit Tracker</div>'+
        '<p class="section-sub">Where '+esc(clientName)+' sits on the climb from foundation to market authority.</p>'+
        '<div class="summit-card"><div class="summit-track">'+summitHtml+'</div>'+
        '<div class="summit-note"><b>Current stage: '+stageNames[curStage].replace('&amp;','&')+'.</b> '+esc(model.summit.note)+'</div></div></div>';
    }

    var gbpPanels = [
      { label:'Total Interactions', cur:g.totalCur, prev:g.totalPrev },
      { label:'Profile Views (Search)', cur:g.viewsCur, prev:g.viewsPrev },
      { label:'Calls', cur:g.callsCur, prev:g.callsPrev },
      { label:'Direction Requests', cur:g.dirCur, prev:g.dirPrev },
      { label:'Website Button Clicks', cur:g.clicksCur, prev:g.clicksPrev }
    ].map(function(p){
      var d = rptDeltaHtmlPlain(p.cur, p.prev);
      return '<div class="panel"><div class="p-label">'+esc(p.label)+'</div><div class="p-value">'+esc(p.cur)+'</div><div class="p-delta '+d.cls+'">'+d.text+'</div></div>';
    }).join('');

    var webDelta = rptDeltaHtmlPlain(w.visitorsCur, w.visitorsPrev);
    var webPanel = '<div class="panel"><div class="p-label">Total Visitors (past 28 days)</div><div class="p-value">'+esc(w.visitorsCur)+'</div><div class="p-delta '+webDelta.cls+'">'+webDelta.text+'</div></div>';

    var queryRowsArr = (model.queries||[]).filter(function(q){ return (q.text||'').trim(); });
    var queryRows = queryRowsArr.map(function(q){
      return '<tr><td>'+esc(q.text)+'</td><td class="num">'+esc(q.clicks)+'</td><td class="num">'+esc(q.impr)+'</td></tr>';
    }).join('');
    var queriesCard = queryRows ? '<div class="card"><div class="card-head"><h3>Top Search Queries</h3><span class="tag">'+esc(periodCur)+'</span></div>'+
      '<table><tr><th>Query</th><th class="num">Clicks</th><th class="num">Impressions</th></tr>'+queryRows+'</table></div>' : '';

    var contentRowsArr = (model.content||[]).filter(function(c){ return (c.title||'').trim(); });
    var contentRows = contentRowsArr.map(function(c){
      return '<tr><td>'+esc(c.title)+'</td><td class="num">'+esc(c.pv)+'</td><td class="num">'+esc(c.sess)+'</td><td class="num">'+esc(c.eng)+'</td><td class="num">'+esc(c.dur)+'</td></tr>';
    }).join('');
    var contentCard = contentRows ? '<div class="card"><div class="card-head"><h3>Top Content</h3><span class="tag">Last 28 Days</span></div>'+
      '<table><tr><th>Title</th><th class="num">Pageviews</th><th class="num">Sessions</th><th class="num">Engagement Rate</th><th class="num">Avg. Duration</th></tr>'+contentRows+'</table></div>' : '';

    var searchContentSection = (queriesCard || contentCard) ? '<div class="section" style="padding-top:0;">'+
      '<div class="section-title">Search &amp; Content Performance</div><p class="section-sub">Top queries and top pages, '+esc(periodCur)+'.</p>'+queriesCard+contentCard+'</div>' : '';

    return '<div class="wrap">'+
      '<div class="hero"><div class="hero-top"><div class="hero-brand">'+esc(companyName)+'</div>'+
      '<span class="hero-eyebrow">Client Performance Report</span></div>'+
      '<h1>'+esc(clientName)+' <span>— Monthly Performance Report</span></h1>'+
      '<p class="period">Reporting Period: '+esc(periodCur)+(periodPrev ? ' vs. '+esc(periodPrev) : '')+'</p>'+
      '<div class="hero-kpis">'+heroKpiHtml+'</div></div>'+
      summitSection+
      '<div class="section" style="'+(showSummit?'padding-top:0;':'')+'"><div class="section-title">Google Business Profile</div>'+
      '<p class="section-sub">'+esc(periodCur)+(periodPrev?' vs. '+esc(periodPrev):'')+'.</p><div class="panel-grid">'+gbpPanels+'</div></div>'+
      '<div class="section" style="padding-top:0;"><div class="section-title">Website Traffic</div>'+
      '<p class="section-sub">'+esc(periodCur)+(periodPrev?' vs. '+esc(periodPrev):'')+'.</p><div class="panel-grid cols-2">'+webPanel+'</div></div>'+
      searchContentSection+
      '<div class="footer"><span>Report prepared by '+esc(companyName)+'.</span>'+
      '<span>'+esc(clientName)+' · '+esc(periodCur)+(periodPrev?' vs. '+esc(periodPrev):'')+'</span></div>'+
      '</div>';
  }

  function buildReportHtml(model, clientName){
    var companyName = model.companyName || business.legalName || '[[Your Company]]';
    var displayClientName = clientName || '[[Client Name]]';
    var body = buildReportBody(model, clientName);
    return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'+
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">'+
      '<title>'+esc(companyName)+' — '+esc(displayClientName)+' Performance Report</title>'+
      '<style>'+RPT_CSS+'</style></head><body>'+body+'</body></html>';
  }

  function reportClientName(){
    var client = clients.find(function(c){ return c.id === reportDraft.clientId; });
    return client ? (client.company ? client.name + ' · ' + client.company : client.name) : (reportDraft.clientName || 'client');
  }
  function reportFileBaseName(clientName){
    return (clientName||'client').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-report-' + (reportDraft.periodKey||'report');
  }

  function downloadReportHtml(){
    var clientName = reportClientName();
    var html = buildReportHtml(reportDraft, clientName);
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = reportFileBaseName(clientName) + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadReportPdf(){
    if(reportPdfBusy) return;
    if(!window.html2pdf){
      alertBanner('Could not load the PDF tool — try Download HTML instead.');
      return;
    }
    var clientName = reportClientName();
    var bodyHtml = buildReportBody(reportDraft, clientName);
    var container = document.createElement('div');
    container.style.position = 'fixed';
    container.style.left = '-10000px';
    container.style.top = '0';
    container.style.width = '1080px';
    container.innerHTML = '<style>' + RPT_CSS + '</style>' + bodyHtml;
    document.body.appendChild(container);

    reportPdfBusy = true;
    render();

    var opt = {
      margin: 0,
      filename: reportFileBaseName(clientName) + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 1080 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    window.html2pdf().set(opt).from(container.querySelector('.wrap')).save().then(function(){
      document.body.removeChild(container);
      reportPdfBusy = false;
      render();
    }).catch(function(){
      document.body.removeChild(container);
      reportPdfBusy = false;
      alertBanner('Could not generate the PDF — try Download HTML instead.');
      render();
    });
  }

  function updateReportPreview(){
    var frame = document.getElementById('report-preview-frame');
    if(!frame || !reportDraft) return;
    var client = clients.find(function(c){ return c.id === reportDraft.clientId; });
    var clientName = client ? (client.company ? client.name + ' · ' + client.company : client.name) : '[[Client Name]]';
    frame.srcdoc = buildReportHtml(reportDraft, clientName);
  }

  /* ---------- reports list ---------- */
  function renderReports(){
    var html = '<div class="view-head"><div><h1>Reports</h1><div class="view-sub">Monthly client performance reports — GBP &amp; website stats</div></div>'+
      '<div class="actions-row"><button class="btn btn-primary" data-nav="reportBuilder">+ New report</button></div></div>';
    html += '<div class="card">';
    if(!reports.length){
      html += emptyState('📊','No reports yet','Build a monthly performance report for a client — next month\'s figures will be filled in for you automatically.', [
        {label:'New report', nav:'reportBuilder', primary:true}
      ]);
    } else {
      var sorted = reports.slice().sort(function(a,b){
        return (b.periodKey||'').localeCompare(a.periodKey||'') || (b.updatedAt||'').localeCompare(a.updatedAt||'');
      });
      html += '<div class="table-wrap"><table><thead><tr><th>Client</th><th>Period</th><th>Updated</th><th></th></tr></thead><tbody>';
      sorted.forEach(function(r){
        html += '<tr>'+
          '<td>'+esc(r.clientName||'—')+'</td>'+
          '<td class="mono">'+esc(r.periodLabel||r.periodKey||'—')+'</td>'+
          '<td>'+ (r.updatedAt ? fmtDate(r.updatedAt.slice(0,10)) : '—') +'</td>'+
          '<td style="text-align:right; white-space:nowrap;">';
        html += '<button class="btn btn-sm btn-ghost" data-nav="reportBuilder" data-edit-id="'+r.id+'">Open</button> ';
        if(uiConfirm === 'report-' + r.id){
          html += '<span class="confirm-inline">Delete? <button class="btn btn-sm btn-danger" data-confirm-delete-report="'+r.id+'">Yes</button><button class="btn btn-sm" data-cancel-confirm="1">No</button></span>';
        } else {
          html += '<button class="btn btn-sm btn-ghost btn-danger" data-ask-delete-report="'+r.id+'">Delete</button>';
        }
        html += '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- report builder form ---------- */
  function statPairField(prefix, label, cur, prev){
    return '<div style="margin-bottom:16px;">'+
      '<label style="margin-bottom:8px;">'+esc(label)+'</label>'+
      '<div class="field-row">'+
      '<div class="field"><label style="font-weight:400;">This period</label><input id="'+prefix+'-cur" type="text" inputmode="decimal" value="'+esc(cur)+'"></div>'+
      '<div class="field"><label style="font-weight:400;">Last period</label><input id="'+prefix+'-prev" type="text" inputmode="decimal" value="'+esc(prev)+'"></div>'+
      '</div></div>';
  }
  function queryRowHtml(q, i){
    return '<div class="field-row" data-idx="'+i+'" style="align-items:flex-end;">'+
      '<div class="field"><label style="font-weight:400;">Query</label><input class="rq-text" type="text" value="'+esc(q.text)+'"></div>'+

  function contentRowHtml(c, i){

      '<div class="field-row" style="align-items:flex-end;">'+

      '</div>'+
      '<div class="field-row">'+
      '<div class="field"><label style="font-weight:400;">Pageviews</label><input class="rc-pv" type="text" value="'+esc(c.pv)+'"></div>'+
      '<div class="field"><label style="font-weight:400;">Sessions</label><input class="rc-sess" type="text" value="'+esc(c.sess)+'"></div>'+
      '<div class="field"><label style="font-weight:400;">Engagement rate</label><input class="rc-eng" type="text" value="'+esc(c.eng)+'"></div>'+
      '<div class="field"><label style="font-weight:400;">Avg. duration</label><input class="rc-dur" type="text" value="'+esc(c.dur)+'"></div>'+
      '</div></div>';
  }
  function renderReportBuilder(){
    var d = reportDraft;
    if(!d) return '<div class="empty"><p>Nothing to show.</p></div>';
    var client = clients.find(function(c){ return c.id === d.clientId; });
    var html = '<div class="view-head"><div><h1>'+(d.id?'Edit report':'New report')+'</h1>'+
      '<div class="view-sub">'+(client? esc(client.name) : 'Choose a client below')+(d.periodKey ? ' · '+esc(monthLabel(d.periodKey)) : '')+'</div></div>'+
      '<div class="actions-row"><button class="btn" data-nav="reports">Cancel</button>'+
      '<button type="button" class="btn" id="download-report-btn">Download HTML</button>'+
      '<button type="button" class="btn" id="download-report-pdf-btn"'+(reportPdfBusy?' disabled':'')+'>'+(reportPdfBusy?'Preparing PDF…':'Download PDF')+'</button>'+
      '<button type="button" class="btn btn-primary" id="save-report-btn">Save report</button></div></div>';

    html += '<div class="card card-pad" style="margin-bottom:18px;">';
    html += '<h3 style="font-size:14px; margin-bottom:14px; color:var(--ink-soft);">Report basics</h3>';
    html += '<div class="field-row">';
    html += '<div class="field"><label>Client</label><select id="rf-client"><option value="">Choose a client…</option>'+
      clients.map(function(c){ return '<option value="'+c.id+'"'+(d.clientId===c.id?' selected':'')+'>'+esc(c.name)+(c.company?' — '+esc(c.company):'')+'</option>'; }).join('')+
      '</select></div>';
    html += '<div class="field"><label>Report company name</label><input id="rf-company" type="text" value="'+esc(d.companyName)+'"></div>';
    html += '</div>';

  function wireReportBuilderEvents(){
    var clientSel = document.getElementById('rf-client');
    if(clientSel) clientSel.addEventListener('change', function(){
      reportDraft.clientId = this.value;
      if(!reportDraft.id) applyPreviousReportAutofill();
      render();
    });
    var companyEl = document.getElementById('rf-company');
    if(companyEl) companyEl.addEventListener('input', function(){ reportDraft.companyName = this.value; updateReportPreview(); });

    var periodEl = document.getElementById('rf-period');
    if(periodEl) periodEl.addEventListener('change', function(){
      reportDraft.periodKey = this.value;
      if(!reportDraft.id) applyPreviousReportAutofill();
      render();
    });
    var prevPeriodEl = document.getElementById('rf-prev-period');
    if(prevPeriodEl) prevPeriodEl.addEventListener('change', function(){ reportDraft.prevPeriodKey = this.value; updateReportPreview(); });

    var summitToggle = document.getElementById('rf-summit-toggle');
    if(summitToggle) summitToggle.addEventListener('change', function(){ reportDraft.summit.show = this.checked; render(); });
    var summitStage = document.getElementById('rf-summit-stage');
    if(summitStage) summitStage.addEventListener('change', function(){ reportDraft.summit.stage = Number(this.value); updateReportPreview(); });
    var summitReason = document.getElementById('rf-summit-reason');
    if(summitReason) summitReason.addEventListener('input', function(){ reportDraft.summit.reason = this.value; updateReportPreview(); });
    var summitNote = document.getElementById('rf-summit-note');
    if(summitNote) summitNote.addEventListener('input', function(){ reportDraft.summit.note = this.value; updateReportPreview(); });

    [
      ['rf-gbp-total','gbp','totalCur','totalPrev'],
      ['rf-gbp-views','gbp','viewsCur','viewsPrev'],
      ['rf-gbp-calls','gbp','callsCur','callsPrev'],
      ['rf-gbp-dir','gbp','dirCur','dirPrev'],
      ['rf-gbp-clicks','gbp','clicksCur','clicksPrev'],
      ['rf-web','web','visitorsCur','visitorsPrev']
    ].forEach(function(cfg){
      var curEl = document.getElementById(cfg[0]+'-cur');
      var prevEl = document.getElementById(cfg[0]+'-prev');
      if(curEl) curEl.addEventListener('input', function(){ reportDraft[cfg[1]][cfg[2]] = this.value; updateReportPreview(); });
      if(prevEl) prevEl.addEventListener('input', function(){ reportDraft[cfg[1]][cfg[3]] = this.value; updateReportPreview(); });
    });

    var queryRows = document.getElementById('report-query-rows');
    if(queryRows){
      queryRows.addEventListener('input', function(e){
        var row = e.target.closest('[data-idx]'); if(!row) return;
        var idx = Number(row.getAttribute('data-idx'));
        if(e.target.classList.contains('rq-text')) reportDraft.queries[idx].text = e.target.value;
        if(e.target.classList.contains('rq-clicks')) reportDraft.queries[idx].clicks = e.target.value;
        if(e.target.classList.contains('rq-impr')) reportDraft.queries[idx].impr = e.target.value;
        updateReportPreview();
      });
      queryRows.addEventListener('click', function(e){
        var btn = e.target.closest('[data-remove-query]'); if(!btn) return;
        var idx = Number(btn.getAttribute('data-remove-query'));
        if(reportDraft.queries.length > 1){ reportDraft.queries.splice(idx,1); render(); }
      });
    }
    var addQueryBtn = document.getElementById('add-query-row-btn');
    if(addQueryBtn) addQueryBtn.addEventListener('click', function(){ reportDraft.queries.push({text:'',clicks:'',impr:''}); render(); });

    var contentRows = document.getElementById('report-content-rows');
    if(contentRows){
      contentRows.addEventListener('input', function(e){
        var row = e.target.closest('[data-idx]'); if(!row) return;
        var idx = Number(row.getAttribute('data-idx'));
        if(e.target.classList.contains('rc-title')) reportDraft.content[idx].title = e.target.value;
        if(e.target.classList.contains('rc-pv')) reportDraft.content[idx].pv = e.target.value;
        if(e.target.classList.contains('rc-sess')) reportDraft.content[idx].sess = e.target.value;
        if(e.target.classList.contains('rc-eng')) reportDraft.content[idx].eng = e.target.value;
        if(e.target.classList.contains('rc-dur')) reportDraft.content[idx].dur = e.target.value;
        updateReportPreview();
      });
      contentRows.addEventListener('click', function(e){
        var btn = e.target.closest('[data-remove-content]'); if(!btn) return;
        var idx = Number(btn.getAttribute('data-remove-content'));
        if(reportDraft.content.length > 1){ reportDraft.content.splice(idx,1); render(); }
      });
    }
    var addContentBtn = document.getElementById('add-content-row-btn');
    if(addContentBtn) addContentBtn.addEventListener('click', function(){ reportDraft.content.push({title:'',pv:'',sess:'',eng:'',dur:''}); render(); });

    var saveBtn = document.getElementById('save-report-btn');
    if(saveBtn) saveBtn.addEventListener('click', saveReport);
    var downloadBtn = document.getElementById('download-report-btn');
    if(downloadBtn) downloadBtn.addEventListener('click', downloadReportHtml);
    var downloadPdfBtn = document.getElementById('download-report-pdf-btn');
    if(downloadPdfBtn) downloadPdfBtn.addEventListener('click', downloadReportPdf);

    updateReportPreview();
  }

  document.addEventListener('click', function(e){
    if(e.target.closest('[data-sign-out]')){ e.preventDefault(); signOutNow(); return; }

    var navEl = e.target.closest('[data-nav]');
    if(navEl){
      var name = navEl.getAttribute('data-nav');
      var params = {};
      if(navEl.hasAttribute('data-kind')) params.kind = navEl.getAttribute('data-kind');
      if(navEl.hasAttribute('data-id')) params.id = navEl.getAttribute('data-id');
      if(navEl.hasAttribute('data-edit-id')) params.editId = navEl.getAttribute('data-edit-id');
      go(name, params);
      return;

    var modalBtn = e.target.closest('[data-modal]');
    if(modalBtn){ modal = {type: modalBtn.getAttribute('data-modal'), editingId:null}; render(); return; }

    var editClientBtn = e.target.closest('[data-edit-client]');

    var askDelDoc = e.target.closest('[data-ask-delete-doc]');
    if(askDelDoc){ uiConfirm = 'doc-' + askDelDoc.getAttribute('data-ask-delete-doc'); render(); return; }
    var confirmDelDoc = e.target.closest('[data-confirm-delete-doc]');
    if(confirmDelDoc){ deleteDoc(confirmDelDoc.getAttribute('data-confirm-delete-doc')); return; }

    var cancelConfirm = e.target.closest('[data-cancel-confirm]');
    if(cancelConfirm){ uiConfirm=null; render(); return; }

    var filterDoc = e.target.closest('[data-filter-doc]');
    if(filterDoc){ docFilter = filterDoc.getAttribute('data-filter-doc'); render(); return; }

    var setStatusBtn = e.target.closest('[data-set-status]');
    if(setStatusBtn){ setStatus(setStatusBtn.getAttribute('data-doc-id'), setStatusBtn.getAttribute('data-set-status')); return; }

    var dupBtn = e.target.closest('[data-duplicate]');
    if(dupBtn){ var d = docs.find(function(x){return x.id===dupBtn.getAttribute('data-duplicate');}); if(d) duplicateDoc(d); return; }

    var convBtn = e.target.closest('[data-convert]');
    if(convBtn){ var q = docs.find(function(x){return x.id===convBtn.getAttribute('data-convert');}); if(q) convertToInvoice(q); return; }

    var pdfBtn = e.target.closest('[data-download-pdf]');
    if(pdfBtn){ var pd = docs.find(function(x){return x.id===pdfBtn.getAttribute('data-download-pdf');}); if(pd) downloadPdf(pd); return; }

    var askDelReport = e.target.closest('[data-ask-delete-report]');
    if(askDelReport){ uiConfirm = 'report-' + askDelReport.getAttribute('data-ask-delete-report'); render(); return; }
    var confirmDelReport = e.target.closest('[data-confirm-delete-report]');
    if(confirmDelReport){ deleteReport(confirmDelReport.getAttribute('data-confirm-delete-report')); return; }

    var setQuoteStatusBtn = e.target.closest('[data-set-quote-status]');
    if(setQuoteStatusBtn){ setSpQuoteStatus(setQuoteStatusBtn.getAttribute('data-quote-id'), setQuoteStatusBtn.getAttribute('data-set-quote-status')); return; }

    var editQuoteBtn = e.target.closest('[data-edit-quote]');
    if(editQuoteBtn){ var eq = spQuotes.find(function(x){return x.id===editQuoteBtn.getAttribute('data-edit-quote');}); if(eq) editQuoteInCalculator(eq); return; }

    var dupQuoteBtn = e.target.closest('[data-duplicate-quote]');
    if(dupQuoteBtn){ var dq = spQuotes.find(function(x){return x.id===dupQuoteBtn.getAttribute('data-duplicate-quote');}); if(dq) duplicateQuoteInCalculator(dq); return; }

    var askDelQuote = e.target.closest('[data-ask-delete-quote]');
    if(askDelQuote){ uiConfirm = 'spquote-' + askDelQuote.getAttribute('data-ask-delete-quote'); render(); return; }
    var confirmDelQuote = e.target.closest('[data-confirm-delete-quote]');
    if(confirmDelQuote){ var delId = confirmDelQuote.getAttribute('data-confirm-delete-quote'); deleteSpQuote(delId); uiConfirm=null; if(view.name==='spQuoteView' && view.params.id===delId) go('spquotes'); else render(); return; }

    var quotePdfBtn = e.target.closest('[data-download-quote-pdf]');
    if(quotePdfBtn){ var pq = spQuotes.find(function(x){return x.id===quotePdfBtn.getAttribute('data-download-quote-pdf');}); if(pq) downloadSpQuotePdf(pq); return; }
  });

  document.addEventListener('submit', function(e){
    if(e.target.id === 'auth-form'){
      e.preventDefault();
      var afd = new FormData(e.target);
      var email = String(afd.get('auth-email')||'').trim();
      var password = String(afd.get('auth-password')||'');
      authEmailValue = email;
      if(!email || !password){ authError = 'Enter your email and password.'; render(); return; }
      signIn(email, password);
      return;
    }
    if(e.target.id === 'business-form'){
      e.preventDefault();
      var fd = new FormData(e.target);
      var data = {};
      ['legalName','regNumber','email','phone','address','bankName','accountHolder','accountNumber','branchCode','accountType'].forEach(function(k){
        data[k] = fd.get(k) || '';
      });
      saveBusiness(data);
      alertBanner('Settings saved.');
    }
    if(e.target.id === 'solidprints-form'){
      e.preventDefault();
      var pfd = new FormData(e.target);
      var markupsList = String(pfd.get('markups')||'').split(',').map(function(s){ return Number(s.trim()); }).filter(function(n){ return !isNaN(n) && n>=0; });
      if(!markupsList.length) markupsList = [100,125,150,175,200];
      var pdata = {
        electricityRate: Number(pfd.get('electricityRate'))||0,
        defaultLabourRate: Number(pfd.get('defaultLabourRate'))||0,
        markups: markupsList,
        defaultMarkup: Number(pfd.get('defaultMarkup'))||markupsList[0],
        customMarkupAllowed: pfd.get('customMarkupAllowed') === 'on',
        defaultWasteGrams: Number(pfd.get('defaultWasteGrams'))||0,
        defaultPackaging: Number(pfd.get('defaultPackaging'))||0,
        defaultLabourOn: pfd.get('defaultLabourOn') === 'on',
        minimumMarginPct: Number(pfd.get('minimumMarginPct'))||0
      };
      saveSpSettings(pdata);
      alertBanner('Solid Prints settings saved.');
    }
  });

  /* ---------------- boot ---------------- */
  render();
})();
</script>
